[package]
name = "rinto-pmo"
version = "0.1.1"
edition = "2021"
description = "Rinto PMO command line client"

[[bin]]
name = "rinto-pmo"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"

[profile.release]
strip = true
opt-level = "z"
lto = true
