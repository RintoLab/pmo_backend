[tools]
erlang = "29.0.4"
elixir = "1.20.2-otp-29"
rust = "1.97.1"

[tasks."cli:build"]
description = "Compile the local rinto-pmo CLI"
dir = "{{config_root}}"
run = "cargo build --locked --manifest-path cli/Cargo.toml --target-dir cli/target"

# These variables belong to the server and its children, including Pi. Keeping
# them out of [env] lets the ordinary terminal keep using the installed CLI.
[tasks.dev]
description = "Start Phoenix with the development CLI, configuration and skills"
# Built rather than assumed: _.path below points at the build directory, so a
# stale or missing binary would leave the topic agent silently running the
# installed release against this server. Cargo is incremental, so an unchanged
# checkout costs a mtime comparison.
depends = ["cli:build"]
dir = "{{config_root}}"
run = "mix phx.server"

[tasks.dev.env]
_.file = { path = ".env", redact = true }
_.path = ["{{config_root}}/cli/target/debug"]
RINTO_CONFIG = "{{config_root}}/config/cli.json"
RINTO_PI_SKILLS_DIR = "{{config_root}}/skills/server"

[tasks."pi:dev"]
description = "Open interactive Pi with the development CLI, configuration and skills"
dir = "{{config_root}}"
raw = true
run = '''
test -x "{{config_root}}/cli/target/debug/rinto-pmo" || {
  echo "development CLI is missing; run: mise run cli:build" >&2
  exit 1
}
exec pi --no-skills --skill "{{config_root}}/skills" "$@"
'''

[tasks."pi:dev".env]
_.path = ["{{config_root}}/cli/target/debug"]
RINTO_CONFIG = "{{config_root}}/config/cli.json"
# This is an outside-topic session using the selected config file. Do not
# inherit a backend's connection overrides or its topic identity.
RINTO_API = false
RINTO_TOKEN = false
RINTO_CONVERSATION_ID = false

[tasks."rinto-pmo:dev"]
description = "Run the development rinto-pmo CLI with its isolated configuration"
dir = "{{config_root}}"
raw = true
run = '''
test -x "{{config_root}}/cli/target/debug/rinto-pmo" || {
  echo "development CLI is missing; run: mise run cli:build" >&2
  exit 1
}
exec rinto-pmo "$@"
'''

[tasks."rinto-pmo:dev".env]
_.path = ["{{config_root}}/cli/target/debug"]
RINTO_CONFIG = "{{config_root}}/config/cli.json"
RINTO_API = false
RINTO_TOKEN = false
RINTO_CONVERSATION_ID = false

[tasks.check]
description = "Run mix check with the local database configuration"
dir = "{{config_root}}"
run = "mix check"

[tasks.check.env]
_.file = { path = ".env", redact = true }
