# CLI and Server are released by one workflow because the Server installs the
# CLI onto its own host: `provision_agent.sh` puts the binary on the PATH that
# a topic's pi uses. Two workflows on the same push raced, and the Server could
# ship on top of the previous CLI. Each half still decides independently whether
# it has anything to release, so a push that touches only one of them releases
# only that one.
#
# One thing does not follow that split: the agent on the Server's host. It is
# provisioned whenever *either* half moved, because the CLI lives on that host
# and the skills live inside the CLI. Making it wait for a Server release left
# a published CLI unreachable to the agent until something unrelated shipped.
name: Release

on:
  push:
    branches: [main]
    tags: ["**"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

# Release steps and deploy helpers intentionally use Bash features such as
# pipefail.
defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: rust-1.97.1
    outputs:
      version: ${{ steps.plan.outputs.version }}
      should_publish: ${{ steps.plan.outputs.should_publish }}
      force: ${{ steps.plan.outputs.force }}
      reason: ${{ steps.plan.outputs.reason }}
      staging_version: ${{ steps.plan.outputs.staging_version }}
      lark_message_id: ${{ steps.notify-start.outputs.message_id }}
    env:
      NACOS_URL: ${{ vars.NACOSURL || secrets.NACOSURL }}
      NACOS_USER: ${{ vars.NACOSUSER || secrets.NACOSUSER }}
      NACOS_PASS: ${{ secrets.NACOSPASS }}
      NACOS_NAMESPACE: ${{ vars.NACOSNAMESPACE || secrets.NACOSNAMESPACE }}
      NACOS_GROUP: ${{ vars.NACOS_GROUP || 'PMO_BE' }}
      CLI_VERSION_DATA_ID: ${{ vars.NACOS_CLI_VERSION_DATA_ID || 'CLI_VERSION' }}
      CLI_COMMIT_DATA_ID: ${{ vars.NACOS_CLI_COMMIT_DATA_ID || 'CLI_COMMIT' }}
      PACKAGE_BASE_URL: ${{ gitea.server_url }}
      PACKAGE_OWNER: ${{ vars.PACKAGE_OWNER || 'Rinto' }}
      PACKAGE_NAME: ${{ vars.PACKAGE_NAME || 'rinto-pmo' }}
      PACKAGE_PUBLISH_USER: ${{ vars.PACKAGE_PUBLISH_USER }}
      PACKAGE_PUBLISH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
    steps:
      - name: Check out the triggered revision
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          SERVER: ${{ gitea.server_url }}
          REPO: ${{ gitea.repository }}
          REF: ${{ gitea.ref }}
          SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          scheme="${SERVER%%://*}"; host="${SERVER#*://}"
          git init -q .
          git remote add origin "${scheme}://x-access-token:${TOKEN}@${host}/${REPO}.git"
          git fetch -q --depth 1 origin "${REF}"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SHA}"

      - name: Notify Lark that CLI release started
        id: notify-start
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_CHAT_ID: ${{ secrets.LARK_CHAT_ID }}
          LARK_API_BASE: ${{ vars.LARK_API_BASE || 'https://open.feishu.cn' }}
          LARK_KEYWORD: ${{ vars.LARK_KEYWORD || 'Rinto 发布' }}
          REF: ${{ gitea.ref }}
          SHA: ${{ gitea.sha }}
          RUN_URL: ${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}
        run: |
          set +e
          version="$(tr -d '[:space:]' < cli/VERSION)"
          message_id="$(deploy/lark_notify.sh start CLI "${version:-unknown}" \
            "${REF}" "${SHA}" "release planning in progress" "${RUN_URL}")"
          printf 'message_id=%s\n' "${message_id}" >> "${GITEA_OUTPUT}"
          exit 0

      - name: Decide whether to publish CLI
        id: plan
        env:
          EVENT: ${{ gitea.event_name }}
          REF_TYPE: ${{ gitea.ref_type }}
          SHA: ${{ gitea.sha }}
          RUN_ID: ${{ gitea.run_id }}
          RUN_ATTEMPT: ${{ gitea.run_attempt }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < cli/VERSION)"
          cargo_version="$(awk -F '"' '/^version = "/ { print $2; exit }' cli/Cargo.toml)"
          test "${version}" = "${cargo_version}" || {
            echo "cli/VERSION ${version} does not match Cargo.toml ${cargo_version}" >&2
            exit 1
          }
          deploy/validate_version.sh "${version}"

          get_optional() {
            local data_id="$1" value status
            set +e; value="$(deploy/nacos.sh get "${data_id}")"; status=$?; set -e
            case "${status}" in 0) printf '%s' "${value}" ;; 4) printf '' ;; *) exit "${status}" ;; esac
          }
          published_version="$(get_optional "${CLI_VERSION_DATA_ID}")"
          published_commit="$(get_optional "${CLI_COMMIT_DATA_ID}")"
          decision="$(deploy/release_decision.sh "${EVENT}" "${REF_TYPE}" \
            "${version}" "${SHA}" "${published_version}" "${published_commit}")"
          action="${decision%%$'\t'*}"; reason="${decision#*$'\t'}"
          force=false
          if [ "${EVENT}" = workflow_dispatch ] || [ "${REF_TYPE}" = tag ]; then force=true; fi
          should_publish=false
          if [ "${action}" = publish ]; then should_publish=true; fi
          {
            echo "version=${version}"
            echo "should_publish=${should_publish}"
            echo "force=${force}"
            echo "reason=${reason}"
            echo "staging_version=${version}-${SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          } >> "${GITEA_OUTPUT}"
          echo "CLI ${version}: ${action} (${reason})"

      - name: Reset this run's staging package
        if: steps.plan.outputs.should_publish == 'true'
        env:
          STAGING_VERSION: ${{ steps.plan.outputs.staging_version }}
        run: |
          set -euo pipefail
          : "${PACKAGE_PUBLISH_USER:?PACKAGE_PUBLISH_USER is required}"
          : "${PACKAGE_PUBLISH_TOKEN:?PACKAGE_PUBLISH_TOKEN is required}"
          deploy/package_registry.sh delete "${PACKAGE_NAME}-staging" "${STAGING_VERSION}"

  build-linux:
    needs: plan
    if: needs.plan.outputs.should_publish == 'true'
    runs-on: rust-1.97.1
    env:
      PACKAGE_BASE_URL: ${{ gitea.server_url }}
      PACKAGE_OWNER: ${{ vars.PACKAGE_OWNER || 'Rinto' }}
      PACKAGE_NAME: ${{ vars.PACKAGE_NAME || 'rinto-pmo' }}
      PACKAGE_PUBLISH_USER: ${{ vars.PACKAGE_PUBLISH_USER }}
      PACKAGE_PUBLISH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
      STAGING_VERSION: ${{ needs.plan.outputs.staging_version }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Install tools and check out
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          SERVER: ${{ gitea.server_url }}
          REPO: ${{ gitea.repository }}
          REF: ${{ gitea.ref }}
          SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git curl ca-certificates musl-tools file
          rm -rf /var/lib/apt/lists/*
          scheme="${SERVER%%://*}"; host="${SERVER#*://}"
          git init -q .
          git remote add origin "${scheme}://x-access-token:${TOKEN}@${host}/${REPO}.git"
          git fetch -q --depth 1 origin "${REF}"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SHA}"

      - name: Test and build Linux amd64
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-linux-musl
          cargo test --locked --manifest-path cli/Cargo.toml
          cargo build --release --locked --manifest-path cli/Cargo.toml \
            --target x86_64-unknown-linux-musl
          cp cli/target/x86_64-unknown-linux-musl/release/rinto-pmo rinto-pmo-linux-amd64
          test "$(./rinto-pmo-linux-amd64 --version)" = "rinto-pmo ${VERSION}"
          file rinto-pmo-linux-amd64 | grep -Eq 'ELF 64-bit.*x86-64.*(static-pie|statically) linked'

      - name: Upload Linux staging binary
        run: deploy/package_registry.sh put "${PACKAGE_NAME}-staging" "${STAGING_VERSION}" rinto-pmo-linux-amd64 rinto-pmo-linux-amd64

  build-darwin:
    needs: plan
    if: needs.plan.outputs.should_publish == 'true'
    runs-on: darwin-arm64
    env:
      PACKAGE_BASE_URL: ${{ gitea.server_url }}
      PACKAGE_OWNER: ${{ vars.PACKAGE_OWNER || 'Rinto' }}
      PACKAGE_NAME: ${{ vars.PACKAGE_NAME || 'rinto-pmo' }}
      PACKAGE_PUBLISH_USER: ${{ vars.PACKAGE_PUBLISH_USER }}
      PACKAGE_PUBLISH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
      STAGING_VERSION: ${{ needs.plan.outputs.staging_version }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Check out the triggered revision
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          SERVER: ${{ gitea.server_url }}
          REPO: ${{ gitea.repository }}
          REF: ${{ gitea.ref }}
          SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          scheme="${SERVER%%://*}"; host="${SERVER#*://}"
          git init -q .
          git remote add origin "${scheme}://x-access-token:${TOKEN}@${host}/${REPO}.git"
          git fetch -q --depth 1 origin "${REF}"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SHA}"

      - name: Test and build Darwin arm64 with mise
        run: |
          set -euo pipefail
          # The repository config imports a local .env for development. CI has
          # no such file and no secrets belong there, so provide an empty one.
          : > .env
          mise trust mise.toml
          mise install rust@1.97.1
          mise exec rust@1.97.1 -- cargo test --locked --manifest-path cli/Cargo.toml
          mise exec rust@1.97.1 -- cargo build --release --locked --manifest-path cli/Cargo.toml \
            --target aarch64-apple-darwin
          cp cli/target/aarch64-apple-darwin/release/rinto-pmo rinto-pmo-darwin-arm64
          test "$(./rinto-pmo-darwin-arm64 --version)" = "rinto-pmo ${VERSION}"
          test "$(lipo -archs rinto-pmo-darwin-arm64)" = arm64

      - name: Upload Darwin staging binary
        run: deploy/package_registry.sh put "${PACKAGE_NAME}-staging" "${STAGING_VERSION}" rinto-pmo-darwin-arm64 rinto-pmo-darwin-arm64

  publish:
    needs: [plan, build-linux, build-darwin]
    if: needs.plan.outputs.should_publish == 'true'
    runs-on: rust-1.97.1
    env:
      NACOS_URL: ${{ vars.NACOSURL || secrets.NACOSURL }}
      NACOS_USER: ${{ vars.NACOSUSER || secrets.NACOSUSER }}
      NACOS_PASS: ${{ secrets.NACOSPASS }}
      NACOS_NAMESPACE: ${{ vars.NACOSNAMESPACE || secrets.NACOSNAMESPACE }}
      NACOS_GROUP: ${{ vars.NACOS_GROUP || 'PMO_BE' }}
      CLI_VERSION_DATA_ID: ${{ vars.NACOS_CLI_VERSION_DATA_ID || 'CLI_VERSION' }}
      CLI_COMMIT_DATA_ID: ${{ vars.NACOS_CLI_COMMIT_DATA_ID || 'CLI_COMMIT' }}
      PACKAGE_BASE_URL: ${{ gitea.server_url }}
      PACKAGE_OWNER: ${{ vars.PACKAGE_OWNER || 'Rinto' }}
      PACKAGE_NAME: ${{ vars.PACKAGE_NAME || 'rinto-pmo' }}
      PACKAGE_PUBLISH_USER: ${{ vars.PACKAGE_PUBLISH_USER }}
      PACKAGE_PUBLISH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
      # Must match POINTER_VERSION in cli/src/update.rs.
      POINTER_VERSION: latest
      VERSION: ${{ needs.plan.outputs.version }}
      STAGING_VERSION: ${{ needs.plan.outputs.staging_version }}
      FORCE: ${{ needs.plan.outputs.force }}
      SHA: ${{ gitea.sha }}
    steps:
      - name: Check out the triggered revision
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          SERVER: ${{ gitea.server_url }}
          REPO: ${{ gitea.repository }}
          REF: ${{ gitea.ref }}
        run: |
          set -euo pipefail
          scheme="${SERVER%%://*}"; host="${SERVER#*://}"
          git init -q .
          git remote add origin "${scheme}://x-access-token:${TOKEN}@${host}/${REPO}.git"
          git fetch -q --depth 1 origin "${REF}"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SHA}"

      - name: Assemble and publish finalized Package
        run: |
          set -euo pipefail
          mkdir dist
          deploy/package_registry.sh get "${PACKAGE_NAME}-staging" "${STAGING_VERSION}" \
            rinto-pmo-linux-amd64 dist/rinto-pmo-linux-amd64
          deploy/package_registry.sh get "${PACKAGE_NAME}-staging" "${STAGING_VERSION}" \
            rinto-pmo-darwin-arm64 dist/rinto-pmo-darwin-arm64
          (cd dist && sha256sum rinto-pmo-linux-amd64 rinto-pmo-darwin-arm64 > SHA256SUMS)
          linux_sha="$(sha256sum dist/rinto-pmo-linux-amd64 | cut -d ' ' -f1)"
          darwin_sha="$(sha256sum dist/rinto-pmo-darwin-arm64 | cut -d ' ' -f1)"
          linux_size="$(stat -c %s dist/rinto-pmo-linux-amd64)"
          darwin_size="$(stat -c %s dist/rinto-pmo-darwin-arm64)"
          jq -n --arg version "${VERSION}" --arg commit "${SHA}" \
            --arg ls "${linux_sha}" --arg ds "${darwin_sha}" \
            --argjson lz "${linux_size}" --argjson dz "${darwin_size}" \
            '{version:$version,commit:$commit,files:{
              "linux-amd64":{name:"rinto-pmo-linux-amd64",sha256:$ls,size:$lz},
              "darwin-arm64":{name:"rinto-pmo-darwin-arm64",sha256:$ds,size:$dz}
            }}' > dist/manifest.json

          if [ "${FORCE}" = true ]; then
            deploy/package_registry.sh delete "${PACKAGE_NAME}" "${VERSION}"
          else
            manifest_url="${PACKAGE_BASE_URL%/}/api/packages/${PACKAGE_OWNER}/generic/${PACKAGE_NAME}/${VERSION}/manifest.json"
            existing="$(mktemp)"
            code="$(curl -sS -o "${existing}" -w '%{http_code}' "${manifest_url}")" || code=000
            case "${code}" in
              200)
                existing_commit="$(jq -r '.commit // empty' "${existing}")"
                if [ "${existing_commit}" = "${SHA}" ]; then
                  echo "final package already matches this commit; repairing pointer and r-nacos state"
                  rm -f "${existing}"
                  deploy/package_registry.sh pointer "${PACKAGE_NAME}" "${POINTER_VERSION}" dist/manifest.json manifest.json
                  deploy/nacos.sh put "${CLI_COMMIT_DATA_ID}" "${SHA}"
                  deploy/nacos.sh put "${CLI_VERSION_DATA_ID}" "${VERSION}"
                  exit 0
                fi
                echo "CLI ${VERSION} already exists for another commit; use a tag/manual force or bump cli/VERSION" >&2
                exit 1
                ;;
              404) ;;
              *) echo "could not inspect existing CLI package (HTTP ${code})" >&2; exit 1 ;;
            esac
            rm -f "${existing}"
          fi

          deploy/package_registry.sh put "${PACKAGE_NAME}" "${VERSION}" dist/rinto-pmo-linux-amd64 rinto-pmo-linux-amd64
          deploy/package_registry.sh put "${PACKAGE_NAME}" "${VERSION}" dist/rinto-pmo-darwin-arm64 rinto-pmo-darwin-arm64
          deploy/package_registry.sh put "${PACKAGE_NAME}" "${VERSION}" dist/SHA256SUMS SHA256SUMS
          deploy/package_registry.sh put "${PACKAGE_NAME}" "${VERSION}" dist/manifest.json manifest.json
          # `rinto-pmo update` discovers releases here: the package-versions API
          # needs a signed-in user, but this file is anonymously readable. It is
          # written after the versioned assets so it never points at a partial
          # publication.
          deploy/package_registry.sh pointer "${PACKAGE_NAME}" "${POINTER_VERSION}" dist/manifest.json manifest.json
          # VERSION is the main-branch completion marker, so write it last.
          deploy/nacos.sh put "${CLI_COMMIT_DATA_ID}" "${SHA}"
          deploy/nacos.sh put "${CLI_VERSION_DATA_ID}" "${VERSION}"

      # Deliberately its own step, after the release is complete: the link only
      # decides where the package is listed, so a failure here should turn the
      # run red without leaving a half-published release behind. The repaired-
      # pointer path above exits the previous step early and still lands here,
      # so a missing link is re-established by re-running the release.
      - name: Link the package to this repository
        env:
          REPO: ${{ gitea.repository }}
        run: deploy/package_registry.sh link "${PACKAGE_NAME}" "${REPO##*/}"

  cleanup-staging:
    needs: [plan, build-linux, build-darwin, publish]
    if: always()
    runs-on: rust-1.97.1
    env:
      PACKAGE_BASE_URL: ${{ gitea.server_url }}
      PACKAGE_OWNER: ${{ vars.PACKAGE_OWNER || 'Rinto' }}
      PACKAGE_NAME: ${{ vars.PACKAGE_NAME || 'rinto-pmo' }}
      PACKAGE_PUBLISH_USER: ${{ vars.PACKAGE_PUBLISH_USER }}
      PACKAGE_PUBLISH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
      STAGING_VERSION: ${{ needs.plan.outputs.staging_version }}
    steps:
      - name: Remove staging package
        if: env.STAGING_VERSION != ''
        run: |
          set +e
          host="${PACKAGE_BASE_URL#*://}"; host="${host%%/*}"
          netrc="$(mktemp)"
          trap 'rm -f "${netrc}"' EXIT
          chmod 600 "${netrc}"
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "${host}" "${PACKAGE_PUBLISH_USER}" "${PACKAGE_PUBLISH_TOKEN}" > "${netrc}"
          code="$(curl -sS --netrc-file "${netrc}" -X DELETE \
            "${PACKAGE_BASE_URL%/}/api/packages/${PACKAGE_OWNER}/generic/${PACKAGE_NAME}-staging/${STAGING_VERSION}" \
            -o /dev/null -w '%{http_code}')" || code=000
          case "${code}" in
            204|404) ;;
            *) echo "warning: staging package cleanup returned HTTP ${code}" >&2 ;;
          esac
          exit 0

  # The CLI's own card, closed the moment the CLI is done. The Server closes its
  # card from inside its own job, so each half reports when that half finishes
  # rather than when the run does. Deliberately not waiting on cleanup-staging:
  # deleting the staging package says nothing about whether the CLI was
  # released, and waiting for it held this card open past the point where the
  # Server had already opened its own -- two cards reading "running" for one
  # release that was half over.
  notify-cli:
    needs: [plan, build-linux, build-darwin, publish]
    if: always()
    runs-on: rust-1.97.1
    steps:
      - name: Finish Lark release card
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          SERVER: ${{ gitea.server_url }}
          REPO: ${{ gitea.repository }}
          REF: ${{ gitea.ref }}
          SHA: ${{ gitea.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          SHOULD_PUBLISH: ${{ needs.plan.outputs.should_publish }}
          REASON: ${{ needs.plan.outputs.reason }}
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_LINUX_RESULT: ${{ needs.build-linux.result }}
          BUILD_DARWIN_RESULT: ${{ needs.build-darwin.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_CHAT_ID: ${{ secrets.LARK_CHAT_ID }}
          LARK_API_BASE: ${{ vars.LARK_API_BASE || 'https://open.feishu.cn' }}
          LARK_KEYWORD: ${{ vars.LARK_KEYWORD || 'Rinto 发布' }}
          LARK_MESSAGE_ID: ${{ needs.plan.outputs.lark_message_id }}
          RUN_URL: ${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}
        run: |
          set +e
          scheme="${SERVER%%://*}"; host="${SERVER#*://}"
          if ! (
            set -e
            mkdir source
            cd source
            git init -q .
            git remote add origin "${scheme}://x-access-token:${TOKEN}@${host}/${REPO}.git"
            git fetch -q --depth 1 origin "${REF}"
            git checkout -q FETCH_HEAD
            test "$(git rev-parse HEAD)" = "${SHA}"
          ); then
            echo "warning: could not check out the exact event SHA for Lark notification" >&2
            exit 0
          fi
          result=failure
          reason="${REASON:-release planning failed}"
          if [ "${PLAN_RESULT}" = success ] && [ "${SHOULD_PUBLISH}" = false ]; then
            result=skipped
          elif [ "${PUBLISH_RESULT}" = success ]; then
            result=success
          else
            reason="${reason}; plan=${PLAN_RESULT}, linux=${BUILD_LINUX_RESULT}, darwin=${BUILD_DARWIN_RESULT}, publish=${PUBLISH_RESULT}"
          fi
          source/deploy/lark_notify.sh finish "${LARK_MESSAGE_ID:-}" CLI "${result}" \
            "${VERSION:-unknown}" "${REF}" "${SHA}" "${reason}" "${RUN_URL}" || true
          exit 0

  release-server:
    needs: [plan, build-linux, build-darwin, publish]
    # Runs unless a CLI job actually failed. Skipped CLI jobs are the normal
    # case -- a push that leaves cli/VERSION alone skips all of them, and the
    # Server still has to go out. A failed one is different: `latest` is then
    # still the previous CLI, and shipping the Server on top of it is the race
    # this workflow exists to remove. The Server makes its own publish decision
    # below; "CLI released, Server unchanged" reaches that decision, finds
    # nothing to publish, and provisions the agent with the new CLI anyway.
    if: >-
      always()
      && needs.plan.result == 'success'
      && needs.build-linux.result != 'failure'
      && needs.build-linux.result != 'cancelled'
      && needs.build-darwin.result != 'failure'
      && needs.build-darwin.result != 'cancelled'
      && needs.publish.result != 'failure'
      && needs.publish.result != 'cancelled'
    runs-on: elixir-1.20.2-erlang-29.0.4-debain-trixie-slim
    env:
      NACOS_URL: ${{ vars.NACOSURL || secrets.NACOSURL }}
      NACOS_USER: ${{ vars.NACOSUSER || secrets.NACOSUSER }}
      NACOS_PASS: ${{ secrets.NACOSPASS }}
      NACOS_NAMESPACE: ${{ vars.NACOSNAMESPACE || secrets.NACOSNAMESPACE }}
      NACOS_GROUP: ${{ vars.NACOS_GROUP || 'PMO_BE' }}
      SERVER_VERSION_DATA_ID: ${{ vars.NACOS_SERVER_VERSION_DATA_ID || 'SERVER_VERSION' }}
      SERVER_COMMIT_DATA_ID: ${{ vars.NACOS_SERVER_COMMIT_DATA_ID || 'SERVER_COMMIT' }}
      SHOULD_PUBLISH: unknown
      # Two decisions, not one. The Server publishes on its own version; the
      # agent has to be provisioned whenever *either* half moved, because the
      # CLI is installed onto the Server's host and its skills are baked into
      # that binary. Gating both on the Server's version left a released CLI
      # sitting in the package registry while the host went on reading the
      # previous one -- and a skill edited in this repository is a CLI-only
      # change, so that is exactly the case it stranded.
      SHOULD_PROVISION: unknown
      RELEASE_REASON: release planning did not complete
      RELEASE_VERSION: unknown
    steps:
      - name: Check out the triggered revision
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          SERVER: ${{ gitea.server_url }}
          REPO: ${{ gitea.repository }}
          REF: ${{ gitea.ref }}
          SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          scheme="${SERVER%%://*}"
          host="${SERVER#*://}"
          git init -q .
          git remote add origin "${scheme}://x-access-token:${TOKEN}@${host}/${REPO}.git"
          git fetch -q --depth 1 origin "${REF}"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SHA}"

      - name: Notify Lark that Server release started
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_CHAT_ID: ${{ secrets.LARK_CHAT_ID }}
          LARK_API_BASE: ${{ vars.LARK_API_BASE || 'https://open.feishu.cn' }}
          LARK_KEYWORD: ${{ vars.LARK_KEYWORD || 'Rinto 发布' }}
          REF: ${{ gitea.ref }}
          SHA: ${{ gitea.sha }}
          RUN_URL: ${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}
        run: |
          set +e
          version="$(tr -d '[:space:]' < VERSION)"
          message_id="$(deploy/lark_notify.sh start Server "${version:-unknown}" \
            "${REF}" "${SHA}" "release planning in progress" "${RUN_URL}")"
          printf 'LARK_MESSAGE_ID=%s\n' "${message_id}" >> "${GITEA_ENV}"
          exit 0

      - name: Decide whether to publish Server
        env:
          EVENT: ${{ gitea.event_name }}
          REF_TYPE: ${{ gitea.ref_type }}
          SHA: ${{ gitea.sha }}
          # Planned *and* carried out: a plan to publish whose `publish` job was
          # skipped left `latest` where it was, and provisioning against it
          # would be a no-op dressed up as an update.
          CLI_PUBLISHED: >-
            ${{ needs.plan.outputs.should_publish == 'true'
            && needs.publish.result == 'success' }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          deploy/validate_version.sh "${version}"

          get_optional() {
            local data_id="$1" value status
            set +e
            value="$(deploy/nacos.sh get "${data_id}")"
            status=$?
            set -e
            case "${status}" in
              0) printf '%s' "${value}" ;;
              4) printf '' ;;
              *) exit "${status}" ;;
            esac
          }
          published_version="$(get_optional "${SERVER_VERSION_DATA_ID}")"
          published_commit="$(get_optional "${SERVER_COMMIT_DATA_ID}")"
          decision="$(deploy/release_decision.sh \
            "${EVENT}" "${REF_TYPE}" "${version}" "${SHA}" \
            "${published_version}" "${published_commit}")"
          action="${decision%%$'\t'*}"
          reason="${decision#*$'\t'}"
          if [ "${action}" = publish ] || [ "${CLI_PUBLISHED}" = true ]; then
            provision=true
          else
            provision=false
          fi
          {
            echo "RELEASE_VERSION=${version}"
            echo "RELEASE_REASON=${reason}"
            if [ "${action}" = publish ]; then
              echo "SHOULD_PUBLISH=true"
            else
              echo "SHOULD_PUBLISH=false"
            fi
            echo "SHOULD_PROVISION=${provision}"
          } >> "${GITEA_ENV}"
          echo "Server ${version}: ${action} (${reason})"
          if [ "${action}" != publish ] && [ "${provision}" = true ]; then
            echo "Server is unchanged, but a CLI went out in this run: the agent will be provisioned"
          fi

      - name: Check deployment inputs
        if: env.SHOULD_PROVISION == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=""
          for pair in "NACOS_URL:${NACOS_URL:-}" \
                      "NACOS_USER:${NACOS_USER:-}" \
                      "NACOS_PASS:${NACOS_PASS:-}" \
                      "NACOS_NAMESPACE:${NACOS_NAMESPACE:-}" \
                      "DEPLOY_HOST:${DEPLOY_HOST:-}" \
                      "DEPLOY_PRIVATE_KEY:${DEPLOY_PRIVATE_KEY:-}"; do
            test -n "${pair#*:}" || missing="${missing} ${pair%%:*}"
          done
          test -z "${missing}" || { echo "empty or not set:${missing}" >&2; exit 1; }
          if [ -n "${DEPLOY_KNOWN_HOSTS}" ]; then
            echo "optional DEPLOY_KNOWN_HOSTS is present; strict host verification will be used"
          else
            echo "optional DEPLOY_KNOWN_HOSTS is absent; intranet accept-new fallback will be used"
          fi

      - name: Build the release
        if: env.SHOULD_PUBLISH == 'true'
        env:
          MIX_ENV: prod
        run: |
          set -euo pipefail
          mix local.hex --force --if-missing
          mix local.rebar --force --if-missing
          mix deps.get --only prod
          mix compile
          mix release --overwrite
          tar -czf release.tar.gz -C _build/prod/rel/pmo_backend .
          sha256sum release.tar.gz > release.tar.gz.sha256

      # Resolved here rather than on the server so the server needs no jq, no
      # reachability to the package registry, and no second copy of the URL
      # scheme -- it receives a file and a checksum, exactly as it does for the
      # release tarball.
      #
      # Still read from the `latest` pointer rather than from the publish job's
      # outputs, so this works identically whether that job published a new CLI
      # in this run or was skipped. The dependency above is what makes the
      # pointer trustworthy: by the time this runs, a CLI belonging to this
      # commit has already been published, or there was none to publish.
      - name: Fetch the current CLI for the server's agent
        if: env.SHOULD_PROVISION == 'true'
        env:
          PACKAGE_BASE_URL: ${{ gitea.server_url }}
          PACKAGE_OWNER: ${{ vars.PACKAGE_OWNER || 'Rinto' }}
          PACKAGE_NAME: ${{ vars.PACKAGE_NAME || 'rinto-pmo' }}
        run: |
          set -euo pipefail
          base="${PACKAGE_BASE_URL%/}/api/packages/${PACKAGE_OWNER}/generic/${PACKAGE_NAME}"
          curl -fsS "${base}/latest/manifest.json" -o cli-manifest.json
          cli_version="$(jq -r '.version // empty' cli-manifest.json)"
          asset="$(jq -r '.files["linux-amd64"].name // empty' cli-manifest.json)"
          sha="$(jq -r '.files["linux-amd64"].sha256 // empty' cli-manifest.json)"
          test -n "${cli_version}" && test -n "${asset}" && test -n "${sha}" || {
            echo "the latest CLI manifest is missing a version or the linux-amd64 asset" >&2
            cat cli-manifest.json >&2
            exit 1
          }
          curl -fsS "${base}/${cli_version}/${asset}" -o rinto-pmo-linux-amd64
          printf '%s  rinto-pmo-linux-amd64\n' "${sha}" > rinto-pmo-linux-amd64.sha256
          sha256sum -c rinto-pmo-linux-amd64.sha256
          echo "AGENT_CLI_VERSION=${cli_version}" >> "${GITEA_ENV}"
          echo "the server's agent will get rinto-pmo ${cli_version}"

      - name: Fetch runtime environment from r-nacos
        if: env.SHOULD_PROVISION == 'true'
        env:
          NACOS_DATA_ID: ${{ vars.NACOS_DATA_ID || '.env' }}
        run: |
          set -euo pipefail
          umask 077
          deploy/nacos.sh get "${NACOS_DATA_ID}" > env
          test -s env || { echo "r-nacos returned an empty ${NACOS_DATA_ID}" >&2; exit 1; }
          echo "fetched $(grep -cE '^[A-Za-z_][A-Za-z0-9_]*=' env) runtime variables"

      # Provisioning runs whenever either half moved; the release swap only when
      # the Server itself is publishing. They stay one step because they share
      # the ssh setup, the staging directories and the cleanup trap -- two steps
      # would open the host twice and keep two copies of all of that in step.
      #
      # `prepare.sh` on a CLI-only run is safe by its own terms: idempotent,
      # system directories only, never touches the release, and it does not
      # restart the service. `deploy.sh` does, and that is the half being
      # skipped.
      - name: Provision the agent, and deploy Server when it is publishing
        if: env.SHOULD_PROVISION == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          PREPARE_USER: ${{ vars.PREPARE_USER || 'root' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$(mktemp -d)"
          prepare_staging="/tmp/pmo_backend-prepare"
          deploy_staging="/tmp/pmo_backend-deploy"
          prepare_staging_created=false
          deploy_staging_created=false
          cleanup() {
            status=$?
            trap - EXIT
            if [ "${deploy_staging_created}" = true ]; then
              ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${HOST}" \
                "rm -rf '${deploy_staging}'" >/dev/null 2>&1 || \
                echo "warning: could not remove deploy-owned Server staging" >&2
            fi
            if [ "${prepare_staging_created}" = true ]; then
              ssh "${ssh_opts[@]}" "${PREPARE_USER}@${HOST}" \
                "rm -rf '${prepare_staging}'" >/dev/null 2>&1 || \
                echo "warning: could not remove root-owned Server staging" >&2
            fi
            rm -rf "${ssh_dir}"
            exit "${status}"
          }
          trap cleanup EXIT
          printf '%s\n' "${KEY}" > "${ssh_dir}/id"
          chmod 600 "${ssh_dir}/id"
          ssh_opts=(-i "${ssh_dir}/id" -o "Port=${PORT}" \
                    -o IdentitiesOnly=yes -o BatchMode=yes)
          if [ -n "${KNOWN_HOSTS}" ]; then
            printf '%s\n' "${KNOWN_HOSTS}" > "${ssh_dir}/known_hosts"
            chmod 600 "${ssh_dir}/known_hosts"
            ssh_opts+=(-o UserKnownHostsFile="${ssh_dir}/known_hosts" -o StrictHostKeyChecking=yes)
            echo "using pinned DEPLOY_KNOWN_HOSTS"
          else
            ssh_opts+=(-o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=accept-new)
            echo "DEPLOY_KNOWN_HOSTS is absent; using the documented intranet accept-new fallback"
          fi

          # Privileged inputs are uploaded as root into a root-owned, mode-700
          # directory. Root never executes or consumes deploy-owned files.
          ssh "${ssh_opts[@]}" "${PREPARE_USER}@${HOST}" \
            "rm -rf '${prepare_staging}' && install -d -m 700 -o root -g root '${prepare_staging}'"
          prepare_staging_created=true
          scp "${ssh_opts[@]}" \
            env deploy/prepare.sh deploy/validate_env.sh deploy/pmo_backend.service \
            "${PREPARE_USER}@${HOST}:${prepare_staging}/"
          ssh "${ssh_opts[@]}" "${PREPARE_USER}@${HOST}" \
            "bash '${prepare_staging}/prepare.sh'"

          # Unprivileged release inputs remain in a separate deploy-owned tree.
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${HOST}" \
            "rm -rf '${deploy_staging}' && mkdir -m 700 '${deploy_staging}'"
          deploy_staging_created=true

          # The agent's inputs go up either way. The release tarball only when
          # there is one -- a CLI-only run never built it.
          scp "${ssh_opts[@]}" \
            deploy/provision_agent.sh rinto-pmo-linux-amd64 rinto-pmo-linux-amd64.sha256 \
            "${DEPLOY_USER}@${HOST}:${deploy_staging}/"
          scp "${ssh_opts[@]}" -r \
            deploy/agent "${DEPLOY_USER}@${HOST}:${deploy_staging}/"
          if [ "${SHOULD_PUBLISH}" = true ]; then
            scp "${ssh_opts[@]}" \
              release.tar.gz release.tar.gz.sha256 deploy/deploy.sh deploy/validate_env.sh \
              "${DEPLOY_USER}@${HOST}:${deploy_staging}/"
          fi

          # Before the swap: a failure here leaves the running release untouched.
          # It also needs the unit prepare.sh just installed, whose PATH is what
          # makes the CLI reachable to a topic's pi.
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${HOST}" \
            "bash '${deploy_staging}/provision_agent.sh' '${AGENT_CLI_VERSION}'"

          if [ "${SHOULD_PUBLISH}" = true ]; then
            ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${HOST}" \
              "bash '${deploy_staging}/deploy.sh' '${RELEASE_VERSION}'"
          else
            echo "Server is unchanged; the agent was provisioned and nothing was swapped"
          fi

      - name: Record successful Server publication
        if: env.SHOULD_PUBLISH == 'true'
        env:
          SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          # VERSION is the main-branch completion marker, so write it last.
          deploy/nacos.sh put "${SERVER_COMMIT_DATA_ID}" "${SHA}"
          deploy/nacos.sh put "${SERVER_VERSION_DATA_ID}" "${RELEASE_VERSION}"

      - name: Forget runtime environment
        if: always()
        run: shred -u env 2>/dev/null || rm -f env

      - name: Finish Lark release card
        if: always()
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_CHAT_ID: ${{ secrets.LARK_CHAT_ID }}
          LARK_API_BASE: ${{ vars.LARK_API_BASE || 'https://open.feishu.cn' }}
          LARK_KEYWORD: ${{ vars.LARK_KEYWORD || 'Rinto 发布' }}
          JOB_STATUS: ${{ job.status }}
          REF: ${{ gitea.ref }}
          SHA: ${{ gitea.sha }}
          RUN_URL: ${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}
        run: |
          result=failure
          reason="${RELEASE_REASON}"
          if [ "${SHOULD_PUBLISH}" = false ] && [ "${JOB_STATUS}" = success ]; then
            result=skipped
            # Still "skipped" -- no Server went out. But something did happen on
            # the host, and a card that says only "skipped" would have somebody
            # looking for the change where it is not.
            if [ "${SHOULD_PROVISION:-unknown}" = true ]; then
              reason="${reason}; the agent was provisioned with the CLI released in this run"
            fi
          elif [ "${JOB_STATUS}" = success ]; then
            result=success
          else
            reason="${reason}; job=${JOB_STATUS}"
          fi
          if [ -x deploy/lark_notify.sh ]; then
            deploy/lark_notify.sh finish "${LARK_MESSAGE_ID:-}" Server "${result}" \
              "${RELEASE_VERSION}" "${REF}" "${SHA}" "${reason}" "${RUN_URL}" || true
          else
            echo "warning: Lark notification helper is unavailable" >&2
          fi
          exit 0
