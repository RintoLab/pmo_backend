name: Release Server

on:
  push:
    branches: [main]
    tags: ["**"]
  workflow_dispatch:

concurrency:
  group: release-server
  cancel-in-progress: false

jobs:
  release:
    runs-on: amd64
    container:
      image: ${{ vars.BUILD_IMAGE || 'hexpm/elixir:1.20.2-erlang-29.0.4-debian-trixie-20260713-slim' }}
    defaults:
      run:
        shell: bash
    env:
      NACOS_URL: ${{ vars.NACOSURL || secrets.NACOSURL }}
      NACOS_USER: ${{ vars.NACOSUSER || secrets.NACOSUSER }}
      NACOS_PASS: ${{ secrets.NACOSPASS }}
      NACOS_NAMESPACE: ${{ vars.NACOSNAMESPACE || secrets.NACOSNAMESPACE }}
      NACOS_GROUP: ${{ vars.NACOS_GROUP || 'PMO_BE' }}
      SERVER_VERSION_DATA_ID: ${{ vars.NACOS_SERVER_VERSION_DATA_ID || 'SERVER_VERSION' }}
      SERVER_COMMIT_DATA_ID: ${{ vars.NACOS_SERVER_COMMIT_DATA_ID || 'SERVER_COMMIT' }}
      SHOULD_PUBLISH: unknown
      RELEASE_REASON: release planning did not complete
      RELEASE_VERSION: unknown
    steps:
      - name: Install release planning tools
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl ca-certificates jq
          rm -rf /var/lib/apt/lists/*

      - name: Check out the triggered revision
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          SERVER: ${{ gitea.server_url }}
          REPO: ${{ gitea.repository }}
          REF: ${{ gitea.ref }}
          SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          scheme="${SERVER%%://*}"
          host="${SERVER#*://}"
          git init -q .
          git remote add origin "${scheme}://x-access-token:${TOKEN}@${host}/${REPO}.git"
          git fetch -q --depth 1 origin "${REF}"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SHA}"

      - name: Notify Lark that Server release started
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_CHAT_ID: ${{ secrets.LARK_CHAT_ID }}
          LARK_API_BASE: ${{ vars.LARK_API_BASE || 'https://open.feishu.cn' }}
          LARK_KEYWORD: ${{ vars.LARK_KEYWORD || 'Rinto 发布' }}
          REF: ${{ gitea.ref }}
          SHA: ${{ gitea.sha }}
          RUN_URL: ${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}
        run: |
          set +e
          version="$(tr -d '[:space:]' < VERSION)"
          message_id="$(deploy/lark_notify.sh start Server "${version:-unknown}" \
            "${REF}" "${SHA}" "release planning in progress" "${RUN_URL}")"
          printf 'LARK_MESSAGE_ID=%s\n' "${message_id}" >> "${GITEA_ENV}"
          exit 0

      - name: Decide whether to publish Server
        env:
          EVENT: ${{ gitea.event_name }}
          REF_TYPE: ${{ gitea.ref_type }}
          SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          deploy/validate_version.sh "${version}"

          get_optional() {
            local data_id="$1" value status
            set +e
            value="$(deploy/nacos.sh get "${data_id}")"
            status=$?
            set -e
            case "${status}" in
              0) printf '%s' "${value}" ;;
              4) printf '' ;;
              *) exit "${status}" ;;
            esac
          }
          published_version="$(get_optional "${SERVER_VERSION_DATA_ID}")"
          published_commit="$(get_optional "${SERVER_COMMIT_DATA_ID}")"
          decision="$(deploy/release_decision.sh \
            "${EVENT}" "${REF_TYPE}" "${version}" "${SHA}" \
            "${published_version}" "${published_commit}")"
          action="${decision%%$'\t'*}"
          reason="${decision#*$'\t'}"
          {
            echo "RELEASE_VERSION=${version}"
            echo "RELEASE_REASON=${reason}"
            if [ "${action}" = publish ]; then
              echo "SHOULD_PUBLISH=true"
            else
              echo "SHOULD_PUBLISH=false"
            fi
          } >> "${GITEA_ENV}"
          echo "Server ${version}: ${action} (${reason})"

      - name: Check deployment inputs
        if: env.SHOULD_PUBLISH == 'true'
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=""
          for pair in "NACOS_URL:${NACOS_URL:-}" \
                      "NACOS_USER:${NACOS_USER:-}" \
                      "NACOS_PASS:${NACOS_PASS:-}" \
                      "NACOS_NAMESPACE:${NACOS_NAMESPACE:-}" \
                      "DEPLOY_HOST:${DEPLOY_HOST:-}" \
                      "DEPLOY_PRIVATE_KEY:${DEPLOY_PRIVATE_KEY:-}"; do
            test -n "${pair#*:}" || missing="${missing} ${pair%%:*}"
          done
          test -z "${missing}" || { echo "empty or not set:${missing}" >&2; exit 1; }
          if [ -n "${DEPLOY_KNOWN_HOSTS}" ]; then
            echo "optional DEPLOY_KNOWN_HOSTS is present; strict host verification will be used"
          else
            echo "optional DEPLOY_KNOWN_HOSTS is absent; intranet accept-new fallback will be used"
          fi

      - name: Install build and deployment tools
        if: env.SHOULD_PUBLISH == 'true'
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            build-essential openssh-client
          rm -rf /var/lib/apt/lists/*

      - name: Build the release
        if: env.SHOULD_PUBLISH == 'true'
        env:
          MIX_ENV: prod
        run: |
          set -euo pipefail
          mix local.hex --force --if-missing
          mix local.rebar --force --if-missing
          mix deps.get --only prod
          mix compile
          mix release --overwrite
          tar -czf release.tar.gz -C _build/prod/rel/pmo_backend .
          sha256sum release.tar.gz > release.tar.gz.sha256

      - name: Fetch runtime environment from r-nacos
        if: env.SHOULD_PUBLISH == 'true'
        env:
          NACOS_DATA_ID: ${{ vars.NACOS_DATA_ID || '.env' }}
        run: |
          set -euo pipefail
          umask 077
          deploy/nacos.sh get "${NACOS_DATA_ID}" > env
          test -s env || { echo "r-nacos returned an empty ${NACOS_DATA_ID}" >&2; exit 1; }
          echo "fetched $(grep -cE '^[A-Za-z_][A-Za-z0-9_]*=' env) runtime variables"

      - name: Ship and deploy Server
        if: env.SHOULD_PUBLISH == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
          HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          PREPARE_USER: ${{ vars.PREPARE_USER || 'root' }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
          PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$(mktemp -d)"
          prepare_staging="/tmp/pmo_backend-prepare"
          deploy_staging="/tmp/pmo_backend-deploy"
          prepare_staging_created=false
          deploy_staging_created=false
          cleanup() {
            status=$?
            trap - EXIT
            if [ "${deploy_staging_created}" = true ]; then
              ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${HOST}" \
                "rm -rf '${deploy_staging}'" >/dev/null 2>&1 || \
                echo "warning: could not remove deploy-owned Server staging" >&2
            fi
            if [ "${prepare_staging_created}" = true ]; then
              ssh "${ssh_opts[@]}" "${PREPARE_USER}@${HOST}" \
                "rm -rf '${prepare_staging}'" >/dev/null 2>&1 || \
                echo "warning: could not remove root-owned Server staging" >&2
            fi
            rm -rf "${ssh_dir}"
            exit "${status}"
          }
          trap cleanup EXIT
          printf '%s\n' "${KEY}" > "${ssh_dir}/id"
          chmod 600 "${ssh_dir}/id"
          ssh_opts=(-i "${ssh_dir}/id" -o "Port=${PORT}" \
                    -o IdentitiesOnly=yes -o BatchMode=yes)
          if [ -n "${KNOWN_HOSTS}" ]; then
            printf '%s\n' "${KNOWN_HOSTS}" > "${ssh_dir}/known_hosts"
            chmod 600 "${ssh_dir}/known_hosts"
            ssh_opts+=(-o UserKnownHostsFile="${ssh_dir}/known_hosts" -o StrictHostKeyChecking=yes)
            echo "using pinned DEPLOY_KNOWN_HOSTS"
          else
            ssh_opts+=(-o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=accept-new)
            echo "DEPLOY_KNOWN_HOSTS is absent; using the documented intranet accept-new fallback"
          fi

          # Privileged inputs are uploaded as root into a root-owned, mode-700
          # directory. Root never executes or consumes deploy-owned files.
          ssh "${ssh_opts[@]}" "${PREPARE_USER}@${HOST}" \
            "rm -rf '${prepare_staging}' && install -d -m 700 -o root -g root '${prepare_staging}'"
          prepare_staging_created=true
          scp "${ssh_opts[@]}" \
            env deploy/prepare.sh deploy/validate_env.sh deploy/pmo_backend.service \
            "${PREPARE_USER}@${HOST}:${prepare_staging}/"
          ssh "${ssh_opts[@]}" "${PREPARE_USER}@${HOST}" \
            "bash '${prepare_staging}/prepare.sh'"

          # Unprivileged release inputs remain in a separate deploy-owned tree.
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${HOST}" \
            "rm -rf '${deploy_staging}' && mkdir -m 700 '${deploy_staging}'"
          deploy_staging_created=true
          scp "${ssh_opts[@]}" \
            release.tar.gz release.tar.gz.sha256 deploy/deploy.sh deploy/validate_env.sh \
            "${DEPLOY_USER}@${HOST}:${deploy_staging}/"
          ssh "${ssh_opts[@]}" "${DEPLOY_USER}@${HOST}" \
            "bash '${deploy_staging}/deploy.sh' '${RELEASE_VERSION}'"

      - name: Record successful Server publication
        if: env.SHOULD_PUBLISH == 'true'
        env:
          SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail
          # VERSION is the main-branch completion marker, so write it last.
          deploy/nacos.sh put "${SERVER_COMMIT_DATA_ID}" "${SHA}"
          deploy/nacos.sh put "${SERVER_VERSION_DATA_ID}" "${RELEASE_VERSION}"

      - name: Forget runtime environment
        if: always()
        run: shred -u env 2>/dev/null || rm -f env

      - name: Finish Lark release card
        if: always()
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_CHAT_ID: ${{ secrets.LARK_CHAT_ID }}
          LARK_API_BASE: ${{ vars.LARK_API_BASE || 'https://open.feishu.cn' }}
          LARK_KEYWORD: ${{ vars.LARK_KEYWORD || 'Rinto 发布' }}
          JOB_STATUS: ${{ job.status }}
          REF: ${{ gitea.ref }}
          SHA: ${{ gitea.sha }}
          RUN_URL: ${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}
        run: |
          result=failure
          reason="${RELEASE_REASON}"
          if [ "${SHOULD_PUBLISH}" = false ] && [ "${JOB_STATUS}" = success ]; then
            result=skipped
          elif [ "${JOB_STATUS}" = success ]; then
            result=success
          else
            reason="${reason}; job=${JOB_STATUS}"
          fi
          if [ -x deploy/lark_notify.sh ]; then
            deploy/lark_notify.sh finish "${LARK_MESSAGE_ID:-}" Server "${result}" \
              "${RELEASE_VERSION}" "${REF}" "${SHA}" "${reason}" "${RUN_URL}" || true
          else
            echo "warning: Lark notification helper is unavailable" >&2
          fi
          exit 0
