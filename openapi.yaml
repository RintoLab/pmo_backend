    AnnotationSummary:
      type: object
      required:
        [
          id,
          document_id,
          actor_id,
          block_id,
          block_text,
          selected_text,
          content,
          status,
          resolved_by_revision_id,
          inserted_at,
          updated_at
        ]
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        block_id:
          type: string
          format: uuid
          nullable: true
        block_text:
          type: string
          nullable: true
          description: Optional snapshot of the block body when the annotation was created.
        selected_text:
          type: string
          nullable: true
          description: Selected text snapshot without positional offsets.
        content:
          type: string
          description: Opening opinion for the annotation thread.
        status:
          type: string
          enum: [open, resolved, dismissed]
          description: >
            Lifecycle of the annotation. Only an explicit human decision moves
            it, via the resolve, dismiss, and reopen actions; being discussed
            never changes it, and it is ignored on create and update.
        resolved_by_revision_id:
          type: string
          format: uuid
          nullable: true
          description: The revision that settled this annotation, when one is named.
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    AnnotationResolveInput:
      type: object
      properties:
        resolved_by_revision_id:
          type: string
          format: uuid
          nullable: true
          description: The revision that settled this annotation, when the caller knows it.
      additionalProperties: false
    Annotation:
      allOf:
        - $ref: "#/components/schemas/AnnotationSummary"
        - type: object
          required: [replies]
          properties:
            replies:
              type: array
              items:
                $ref: "#/components/schemas/AnnotationReply"
          additionalProperties: false
    AnnotationCreateInput:
      type: object
      required: [actor_id, content]
      properties:
        actor_id:
          type: string
          format: uuid
        block_id:
          type: string
          format: uuid
          nullable: true
        block_text:
          type: string
          nullable: true
        selected_text:
          type: string
          nullable: true
        content:
          type: string
          minLength: 1
      additionalProperties: false
    AnnotationUpdateInput:
      type: object
      properties:
        block_id:
          type: string
          format: uuid
          nullable: true
        block_text:
          type: string
          nullable: true
        selected_text:
          type: string
          nullable: true
        content:
          type: string
          minLength: 1
      additionalProperties: false
    Conversation:
      type: object
      required:
        [id, title, actor_id, pi_session_id, hot, inserted_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: Who started the topic.
        pi_session_id:
          type: string
          nullable: true
          description: >
            The pi session claimed to be carrying this topic. Non-null is a
            claim, not a guarantee -- see `hot`.
        hot:
          type: boolean
          description: >
            Whether a live pi process is actually carrying the topic. Derived
            rather than stored, because a session can die with nothing left to
            clear the column. Cold is the resting state, not a failure: the
            messages are enough to revive the topic.
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    ConversationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Conversation"
      additionalProperties: false
    ConversationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
      additionalProperties: false
    ConversationCreateInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          nullable: true
        actor_id:
          type: string
          format: uuid
          nullable: true
      additionalProperties: false
    ConversationUpdateInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          nullable: true
      additionalProperties: false
    MessageRef:
      type: object
      required: [id, ref_type, position, ref_id, ref_document_id, payload]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
          description: >
            The order the references were given in, which is the order they
            expand into the prelude, and so part of what a replay reproduces.
        ref_type:
          type: string
          description: >
            `document`, `annotation`, `project`, `attachment` or
            `conversation`. Not a closed enum: the set grows, and an unknown
            type is stored and ignored rather than rejecting the turn.
        ref_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The normalised, indexed identity, which answers "which topics
            discussed this?". Null when it could not be resolved -- a project
            slug whose project is gone, say -- which costs this reference its
            reverse lookup and nothing else.
        ref_document_id:
          type: string
          format: uuid
          nullable: true
          description: Annotations only, which are reachable solely through their document.
        payload:
          type: object
          additionalProperties: true
          description: >
            The reference map exactly as the client sent it, and what a replay
            re-expands. Kept alongside the normalised columns because neither
            can be derived from the other: a project reference is keyed by
            `slug` rather than `id`.
      additionalProperties: false
    Message:
      type: object
      required:
        [
          id,
          conversation_id,
          actor_id,
          role,
          content,
          position,
          refs,
          inserted_at,
          updated_at
        ]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
          description: >
            Kept even though the actor's kind implies it: a replay needs what
            the agent was given, not our attribution of who gave it.
        content:
          type: string
          description: >
            The raw text, never the prelude expanded from the references.
        position:
          type: integer
          minimum: 0
          description: Monotonic order within the conversation.
        refs:
          type: array
          items:
            $ref: "#/components/schemas/MessageRef"
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    MessageResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Message"
      additionalProperties: false
    MessageListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      additionalProperties: false
    MessageCreateInput:
      type: object
      required: [actor_id, role, content]
      properties:
        actor_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
        refs:
          type: array
          description: Reference maps in the form RintoPMO.Agent.PromptBuilder accepts.
          items:
            type: object
            additionalProperties: true
      additionalProperties: false
    AnnotationReply:
      type: object
      required:
        [
          id,
          annotation_id,
          actor_id,
          content,
          position,
          source_message_id,
          inserted_at,
          updated_at
        ]
      properties:
        id:
          type: string
          format: uuid
        annotation_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        content:
          type: string
        position:
          type: integer
          minimum: 0
          description: Monotonic order within the annotation. Gaps remain after deletions.
        source_message_id:
          type: string
          format: uuid
          nullable: true
          description: The conversation message this conclusion was drawn from, when it came from one.
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    AnnotationReplyCreateInput:
      type: object
      required: [actor_id, content]
      properties:
        actor_id:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
        source_message_id:
          type: string
          format: uuid
          nullable: true
          description: The conversation message this conclusion was drawn from.
      additionalProperties: false
    AnnotationReplyUpdateInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
      additionalProperties: false
    AnnotationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Annotation"
      additionalProperties: false
    AnnotationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AnnotationSummary"
      additionalProperties: false
    AnnotationReplyResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AnnotationReply"
      additionalProperties: false
    AttachmentCreateInput:
      type: object
      required: [actor_id, file]
      properties:
        actor_id:
          type: string
          format: uuid
          description: Actor the upload is attributed to.
        file:
          type: string
          format: binary
          description: >
            The image itself. Its declared content type is ignored; the format
            is sniffed from the bytes.
      additionalProperties: false
    Attachment:
      type: object
      required:
        [
          id,
          actor_id,
          filename,
          mime_type,
          byte_size,
          width,
          height,
          checksum,
          inserted_at,
          last_used_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        filename:
          type: string
          nullable: true
          description: Original upload name, kept for display only.
        mime_type:
          type: string
          enum: [image/png, image/jpeg, image/gif, image/webp]
          description: Detected from the bytes, not from the request.
        byte_size:
          type: integer
          minimum: 1
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        checksum:
          type: string
          description: Lowercase hex SHA-256 of the stored bytes.
        inserted_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When this image was last expanded into an agent prompt. Null means
            it was uploaded but never sent, which is the state an abandoned
            upload stays in. Recorded for a future retention policy; nothing
            deletes on it today.
      additionalProperties: false
    AttachmentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Attachment"
      additionalProperties: false
    APIErrorCode:
      type: string
      description: Stable machine-readable error code.
      enum:
        - bad_request
        - not_found
        - image_too_large
        - unsupported_image
        - stale_document
        - task_state_conflict
        - dependency_cycle
        - validation_error
        - task_blocked
        - review_round_open
        - invalid_block_op
        - invalid_estimate
        - task_not_splittable
        - corrupt_image
        - internal_server_error
        - attachment_unwritable
        - attachment_unreadable
    APIError:
      type: object
      required: [error, message, details]
      properties:
        error:
          $ref: "#/components/schemas/APIErrorCode"
        message:
          type: string
          description: Human-readable error explanation.
        details:
          type: object
          description: Error-specific structured context.
          additionalProperties: true
      additionalProperties: false
    ValidationError:
      type: object
      required: [error, message, details]
      properties:
        error:
          type: string
          enum: [validation_error]
        message:
          type: string
          example: Request validation failed.
        details:
          type: object
          description: Validation messages grouped by request field.
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: false
    NotFoundError:
      type: object
      required: [error, message, details]
      properties:
        error:
          type: string
          enum: [not_found]
        message:
          type: string
          example: The requested resource was not found.
        details:
          type: object
          additionalProperties: false
      additionalProperties: false
