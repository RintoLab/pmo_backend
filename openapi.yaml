        application/json:
          schema:
            $ref: "#/components/schemas/RepoCredentialUpdateInput"
    AnnotationCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnnotationCreateInput"
    AnnotationUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnnotationUpdateInput"
    ConversationUpdate:
      required: true
