openapi: 3.0.3
info:
  title: Rinto PMO API
  description: >
    JSON REST API for Rinto PMO.


    Every endpoint requires the actor token as `Authorization: Bearer <token>`.
    There are no anonymous routes and nothing to bootstrap from over HTTP.


    The token is configuration, not something this API issues: one value agreed
    in advance, given to the server as `RINTO_TOKEN` and written by hand into
    the configuration of each client that calls it. Nothing hands it out and
    nothing rotates it -- rotating means changing the agreed value and
    restarting what holds it. There is correspondingly no endpoint that returns
    or replaces a token.


    This system assumes a single person operating it, so one token is all of
    authentication: it says a request may be answered, and who it is answered
    as is the human actor this installation was set up for
    (`mix rinto.actors.setup_human`). There is no session to establish.


    The token also supplies human attribution. `POST /attachments`,
    `POST /conversations`, `POST /tasks/{id}/claim` and
    `POST /documents/{id}/proposals/{id}/decide` credit the token holder and
    ignore any `actor_id` in the body. Endpoints naming *another* actor --
    `POST /tasks/{id}/assign`, `PUT /settings/{key}`, an assistant switch, and
    anything an AI can author -- still take one, because they are about
    somebody other than the caller.
  version: 0.1.0
security:
  - ActorToken: []
servers:
  - url: http://localhost:4000/api/v1
    description: Development
  - url: https://pmo-api.kenton.wang/api/v1
    description: Production
tags:
  - name: Actors
    description: Global human participants and AI personas.
  - name: AI Models
    description: Providers and models available from the local pi RPC runtime for AI actor configuration.
  - name: Projects
    description: Projects and their archive lifecycle.
  - name: Project Repositories
    description: Read-only Git repositories scoped to a project.
  - name: Documents
    description: Top-level, block-based documents and their immutable revision history.
  - name: Annotations
    description: Document annotations and flat follow-up replies (not review workflow, not AI chat logs).
  - name: Proposals
    description: >
      Proposed block changes and the decisions taken about them. An agent
      writes here rather than straight to a revision, because a revision is
      what a person agreed to. Two live proposals on one block is a contention:
      a question for a human, never a merge.
  - name: Conversations
    description: >
      Topics: the process layer of collaborative review, as opposed to the
      conclusions annotations carry. A conversation belongs to no document --
      a topic can span several -- and what it touches is derived from the refs
      on its messages.
  - name: Tasks
    description: >
      The execution layer: a project's work breakdown, its distribution, and
      its counts. A task consumes documents; it does not carry the process of
      editing them. One tree of one resource -- a summary node is a task row
      with `kind: summary`, and its status is the rollup over its children
      rather than anything it can be told. Assignment and status are separate
      questions, and status moves one endpoint per event rather than as a
      settable field.
  - name: Repo Credentials
    description: Reusable HTTPS username and token credentials.
  - name: References
    description: >
      The `rinto://` addressing scheme: how a body of text points at anything
      else in this system. A reference is written into the text as an ordinary
      Markdown link whose destination is `rinto://{type}/{key}`, so it survives
      a model rewriting the block that carries it -- there is no sidecar array
      the way a chat message has one.


      **A body whose references point at nothing is refused.** Any endpoint
      taking a document body, a proposal, an annotation, a reply or a task
      description answers `422 unresolvable_references`, with the offending
      addresses in `details.uris`. Addresses are bare UUIDs handed out by search
      or by the call that created the thing, so one that resolves to nothing is
      a typo rather than a link to something not yet written -- and a body that
      saved with a dead link in it would fail silently, which is the case this
      exists to prevent.


      Two things are **not** refused. A type this build has never heard of is
      stored and ignored, so that adding a resource type later does not
      invalidate text already written. A malformed URI is not a reference at all
      -- refusing over one would make this a validator of link syntax.


      Messages are never refused. A conversation is somebody thinking out loud,
      and losing a message over a mistyped link would trade the thing that
      matters for the index.
  - name: Attachments
    description: >
      Uploaded images, referenced from AI chat messages. Validated once at
      upload so that expanding a reference later is a plain read.
  - name: Jobs
    description: >
      Background work, looked up by the id the endpoint that started it handed
      back. Read-only and deliberately thin: this is not a queue console, it is
      the way back for a client that lost its connection while something was
      running. Absent means finished -- pruning only ever reaches jobs that are
      over.
  - name: Settings
    description: >
      Which actor does a job that belongs to the system rather than to any one
      topic -- naming conversations, so far. Deliberately runtime state rather
      than configuration: it is chosen while looking at the actor list, and
      changed again after seeing a few of the results.
paths:
  /actors:
    get:
      tags: [Actors]
      operationId: listActors
      summary: List all actors
      responses:
        "200":
          description: Actor list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorListResponse"
    post:
      tags: [Actors]
      operationId: createActor
      summary: Create an actor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActorCreateInput"
      responses:
        "201":
          description: Actor created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /actors/me:
    get:
      tags: [Actors]
      operationId: getCurrentActor
      summary: Get the actor the request's token belongs to
      description: >
        The whole of "log in": there is no session to establish, so a client
        resolves its identity once at startup and then has no further use for
        it -- nothing it sends says who it is any more. The token is never in
        the response.
      responses:
        "200":
          description: The authenticated actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /actors/{id}:
    parameters:
      - $ref: "#/components/parameters/ActorId"
    get:
      tags: [Actors]
      operationId: getActor
      summary: Get an actor
      responses:
        "200":
          description: Actor details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Actors]
      operationId: updateActor
      summary: Update an actor
      description: The actor kind is immutable after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActorUpdateInput"
      responses:
        "200":
          description: Actor updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Actors]
      operationId: replaceActor
      summary: Update an actor
      description: Alias of PATCH. The actor kind is immutable after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActorUpdateInput"
      responses:
        "200":
          description: Actor updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /settings:
    get:
      tags: [Settings]
      operationId: listSettings
      summary: Who does each system-wide job
      description: >
        Answers with every role the system has, including the empty ones, so a
        client renders the same list whether or not anybody has chosen
        anything. Each role carries the actor whole rather than an id.
      responses:
        "200":
          description: Every role and the actor in it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
  /settings/{key}:
    parameters:
      - $ref: "#/components/parameters/SettingKey"
    put:
      tags: [Settings]
      operationId: putSetting
      summary: Put an actor in a role
      description: >
        Replaces whoever was in the role; send `"actor_id": null` to empty it.
        The actor must be an enabled AI actor -- a human has no model to ask.
        Disabling or deleting the actor later is not an error: the role reads
        as empty, and what that means is the reader's to decide. `title_actor`
        falls back to the topic's own assistant; `decomposition_actor` has no
        conversation to inherit from, so decomposition is refused until the
        role is filled again.


        Roles are defined by the system, so an unknown `key` is a 404 rather
        than the creation of a new one. The response is the full set, the same
        shape `GET /settings` returns.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingUpdateInput"
      responses:
        "200":
          description: Every role and the actor in it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List active projects
      responses:
        "200":
          description: Active project list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      requestBody:
        $ref: "#/components/requestBodies/ProjectCreate"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /projects/{slug}:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get an active or archived project
      responses:
        "200":
          description: Project details including repositories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update project metadata
      description: Status cannot be changed through this endpoint.
      requestBody:
        $ref: "#/components/requestBodies/ProjectUpdate"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Projects]
      operationId: replaceProject
      summary: Update project metadata
      description: Alias of PATCH. Status cannot be changed through this endpoint.
      requestBody:
        $ref: "#/components/requestBodies/ProjectUpdate"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Projects]
      operationId: archiveProject
      summary: Archive a project
      description: Idempotently sets status to archived. The project is not physically deleted and cannot be restored.
      responses:
        "204":
          description: Project archived
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{slug}/repos:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    get:
      tags: [Project Repositories]
      operationId: listProjectRepos
      summary: List repositories for an active project
      responses:
        "200":
          description: Project repository list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRepoListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Project Repositories]
      operationId: createProjectRepo
      summary: Add a repository to an active project
      requestBody:
        $ref: "#/components/requestBodies/ProjectRepoCreate"
      responses:
        "201":
          description: Project repository created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRepoResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /projects/{slug}/repos/{id}:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
      - $ref: "#/components/parameters/ProjectRepoId"
    get:
      tags: [Project Repositories]
      operationId: getProjectRepo
      summary: Get a repository scoped to an active project
      responses:
        "200":
          description: Project repository details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRepoResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Project Repositories]
      operationId: updateProjectRepo
      summary: Update a repository configuration
      requestBody:
        $ref: "#/components/requestBodies/ProjectRepoUpdate"
      responses:
        "200":
          description: Project repository updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRepoResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Project Repositories]
      operationId: replaceProjectRepo
      summary: Update a repository configuration
      description: Alias of PATCH.
      requestBody:
        $ref: "#/components/requestBodies/ProjectRepoUpdate"
      responses:
        "200":
          description: Project repository updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRepoResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Project Repositories]
      operationId: deleteProjectRepo
      summary: Delete a repository configuration
      responses:
        "204":
          description: Project repository deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{slug}/tasks:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List a project's tasks
      description: >
        Oldest first, unlike annotations and conversations: a backlog is worked
        from the front. Flat order, not tree order -- every row carries
        `parent_id`, so a client that wants the WBS shape builds it once, and
        one that wants a queue is not made to unpick a tree first. Summary
        nodes come back with their rolled-up status. Every filter combines with
        the others.
      parameters:
        - name: kind
          in: query
          required: false
          description: >
            Filter to real work or to summary nodes. The claimable pool is
            `kind=work&assignee_id=none&live=true` -- without `kind`, covers
            come back too, and nobody can pick one up.
          schema:
            $ref: "#/components/schemas/TaskKind"
        - name: status
          in: query
          required: false
          description: >
            Filter by exactly one status. On summary nodes this matches the
            rollup, not the stored column.
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: parent_id
          in: query
          required: false
          description: >
            Filter by position in the tree. Use `none` for the roots -- the top
            level of the WBS.
          schema:
            oneOf:
              - type: string
                format: uuid
              - type: string
                enum: [none]
        - name: assignee_id
          in: query
          required: false
          description: >
            Filter by owner. Use `none` for the claimable pool -- it has to be
            spelled, because an absent parameter already means "no filter".
          schema:
            oneOf:
              - type: string
                format: uuid
              - type: string
                enum: [none]
        - name: document_id
          in: query
          required: false
          description: Filter by the document a task implements against.
          schema:
            type: string
            format: uuid
        - name: live
          in: query
          required: false
          description: >
            When true, only outstanding work (`open`, `in_progress`); when
            false, only `done` and `cancelled`.
          schema:
            type: boolean
        - name: overdue
          in: query
          required: false
          description: >
            When true, only outstanding tasks whose `due_on` has passed. A task
            delivered late was late; it is not still late, so finished work is
            never overdue.
          schema:
            type: boolean
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Tasks]
      operationId: createTask
      summary: File a task under a project
      description: >
        The task starts `open`. An assignee is optional: creating work and
        deciding whose it is are separate acts. Pass `kind: summary` for a
        cover node -- it takes no assignee, accepts no events, and draws its
        status from its children.
      requestBody:
        $ref: "#/components/requestBodies/TaskCreate"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TaskCycle"
        "422":
          $ref: "#/components/responses/TaskInvalidInput"
  /projects/{slug}/tasks/stats:
    parameters:
      - $ref: "#/components/parameters/ProjectSlug"
    get:
      tags: [Tasks]
      operationId: getTaskStats
      summary: Count a project's work by status and by assignee
      description: >
        Aggregated server-side so a board does not have to pull every row to
        draw a header. Summary nodes are excluded from every number: a cover is
        its children restated, so counting it would tally each job twice and
        make the totals a function of how finely someone broke the project
        down. `by_status` always carries every status, including the ones at
        zero -- a board that hides its empty columns changes shape as work
        moves through it.
      responses:
        "200":
          description: Task counts and estimate totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents:
    get:
      tags: [Documents]
      operationId: listDocuments
      summary: List non-archived documents
      parameters:
        - name: project_id
          in: query
          required: false
          description: Filter by project UUIDv7 id. Use `none` for unassigned documents; omit for all documents.
          schema:
            oneOf:
              - type: string
                format: uuid
              - type: string
                enum: [none]
        - name: status
          in: query
          required: false
          description: >-
            Filter by how far along the document is. Omit to list every state --
            every document is created `draft`, so filtering those out by default
            would hide nearly the whole corpus. Combines with `project_id`.
          schema:
            type: string
            enum: [draft, formal, applied]
      responses:
        "200":
          description: Document summaries with their latest revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
        "400":
          description: Invalid project or status filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
    post:
      tags: [Documents]
      operationId: createDocument
      summary: Create a document and its initial revision
      description: >
        The body is sent as one Markdown document and cut into blocks by the server.
        See `DocumentCreateInput.markdown` for where it cuts.


        The document is always created with `status: "draft"` and there is no way to
        ask for anything else -- writing something down is not the same as vouching
        for it. Only a person moves it on, with
        `POST /documents/{document_id}/formalize`.
      requestBody:
        $ref: "#/components/requestBodies/DocumentCreate"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /backlinks:
    get:
      tags: [References]
      operationId: listBacklinks
      summary: List everything whose text points at one thing
      description: >-
        The other direction from `POST /references/resolve`: not what this body
        points at, but what points at this. Keyed by the canonical URI, so that
        what an author pasted into a body and what is asked here are the same
        string.


        There is deliberately no outbound counterpart. A client holds the body
        and can read its own references off it; only the reverse needs an index.


        Backlinks are a query result, never written back into the target's text.
        Roam, Obsidian and Notion all decline to do that, and a system that
        edited what a person or a model wrote would be worse than one that did
        not.


        A reference whose target has since been deleted still answers here --
        keeping the row is the whole reason there are no foreign keys. Nothing
        here reports whether the *source* still exists: it does, or the row would
        have gone with it.


        Only the newest revision of each document is indexed, so this answers
        "who points at this now" rather than "who ever did".
      parameters:
        - name: target
          in: query
          required: true
          description: The canonical `rinto://` URI of the thing being asked about.
          schema:
            type: string
            example: "rinto://task/01936f2a-1c4e-7c3a-9f1b-2d4e6a8b0c1d"
      responses:
        "200":
          description: What points at it, grouped by the kind of source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BacklinksResponse"
        "400":
          description: "`target` is missing"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /search:
    get:
      tags: [References]
      operationId: search
      summary: Find things by meaning
      description: >-
        Two stages. The query is embedded, the nearest hundred rows are pulled by
        cosine distance, and a reranker then reads the query against each and
        scores it properly. The first stage is cheap and rough; the second is the
        one that is right.


        A hundred is measured rather than chosen for comfort: across three
        queries on this system's own content, the best result after reranking sat
        at cosine rank 27, 25 and 56, so a candidate set of twenty would have
        missed all three. The embedding model is small and its recall is
        correspondingly rough, which is what reranking is for.


        **One kind of thing per request.** Nothing merges a ranking across types,
        because there is no need to -- listing tasks and listing documents
        already have their own endpoints. Asking about two kinds means asking
        twice.


        **What matches is not always what is returned.** Searching `document`
        matches blocks and answers with their documents, since a document's
        content is its sections; searching `annotation` matches annotations and
        their replies and answers with the thread. Duplicates collapse to their
        best-scoring member, so a document whose four sections all match is one
        result.


        **`uri` is the field that matters**: it is the canonical address, so a
        model pastes it straight into a body and a client hands it to
        `POST /references/resolve` or `GET /backlinks` unchanged. Nothing has to
        assemble an id.


        Content written in the last few seconds may not be here yet -- a row is
        findable once its vector has been computed, which happens on a sweep
        rather than at write time.
      parameters:
        - name: q
          in: query
          required: true
          description: What to look for, in natural language.
          schema:
            type: string
        - name: type
          in: query
          required: true
          description: >
            Which kind of thing to search. **Required, with no default.** A
            caller that has not said what it is looking for has not decided yet,
            and choosing for it would mean quietly searching one kind of thing
            while the caller believed it was searching everything -- a wrong
            answer that looks like a right one.


            `block` is where a body's content lives: a document is found through
            the section that says the thing. Ask for `document` to get the
            document rather than the section.


            A type nothing is indexed under is refused rather than answered with
            an empty list.
          schema:
            type: string
            enum: [block, document, annotation, task, project, conversation, attachment]
        - name: project_id
          in: query
          required: false
          description: Narrow to one project. Scope filters before distance does.
          schema:
            type: string
            format: uuid
        - name: include_archived
          in: query
          required: false
          description: >
            Archived things are left out by default, and this is the client's
            filter to set rather than a judgement made for it. It differs from
            `GET /backlinks`, which must answer completely -- that asks "who
            pointed at this", where an omission would be wrong.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          description: Results to return after reranking.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Results, best first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: "`q` or `type` is missing, or `limit` is not a positive number"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          description: >
            `unsearchable_type` -- nothing of that kind is indexed; or
            `blank_query` -- `q` was empty or whitespace. A blank query is
            refused rather than treated as "everything": an empty string embeds
            to a vector like any other, and that vector has neighbours, so the
            alternative is a list ordered by nothing that looks like an answer.
            Browsing is `GET /documents`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "503":
          description: >
            `ai_not_configured` -- this server was started without
            `RINTO_AI_TOKEN`, so it has no way to embed a query and never will
            until somebody deploys it one; or `ai_unavailable` -- the inference
            service refused or could not be reached.


            Both are the whole of the search rather than a degraded one. Without
            a vector there is no query at all, and without reranking what is
            left is cosine order, which is the order this endpoint's second
            stage exists because it was measured to be wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /references/resolve:
    post:
      tags: [References]
      operationId: resolveReferences
      summary: Resolve rinto:// URIs into what they point at
      description: >-
        Answers what each `rinto://` URI in a body points at: a title to preview,
        and whether the target is still there. A client holds the body, so it can
        find its own outbound references without asking -- what it cannot do is
        say what is at them.


        A POST because the input is a list of URIs containing slashes: a body with
        thirty references would need every one escaped into a query string long
        enough to be refused. Nothing is stored, the same as
        `POST /documents/preview_blocks`.


        Results come back in the order asked, and a URI repeated in the request is
        repeated in the response -- a client lines these up against the occurrences
        in the text, and a collapsed list would misalign them.


        No URLs are returned, deliberately. A result names a type and identifiers;
        where those live in a client is the client's decision. Returning paths would
        bind bodies stored in the database to a web application's routing, which is
        the coupling `rinto://` exists to avoid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveReferencesInput"
      responses:
        "200":
          description: One result per URI asked about, in order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveReferencesResponse"
        "400":
          description: "`uris` is missing or is not a list of strings"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          description: More references than one request carries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /documents/preview_blocks:
    post:
      tags: [Documents]
      operationId: previewDocumentBlocks
      summary: Preview how a Markdown body cuts into blocks
      description: >-
        Reports the blocks `POST /documents` would produce from this body, creating
        nothing. The split is the server's decision, so this is how an author checks
        the grain before living with it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentPreviewBlocksInput"
      responses:
        "200":
          description: The blocks the body would be cut into, in document order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPreviewBlocksResponse"
        "400":
          description: The body is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /documents/{document_id}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Documents]
      operationId: getDocument
      summary: Get a document with its latest revision and blocks
      responses:
        "200":
          description: Document details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Documents]
      operationId: archiveDocument
      summary: Archive a document
      description: Idempotently archives the document. Archived documents are omitted from lists.
      responses:
        "204":
          description: Document archived
        "404":
          $ref: "#/components/responses/NotFound"
  /documents/{document_id}/formalize:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      tags: [Documents]
      operationId: formalizeDocument
      summary: Adopt a draft document as a formal one
      description: >
        Moves `status` from `draft` to `formal`, idempotently. The only way out of
        the state every document is created in, and a person's action alone: it
        records that somebody looked at the document and decided it counts, which is
        not a judgement its author can make on its own behalf -- so this has no
        counterpart in the agent CLI.


        Nothing about the content moves. No revision is created and no proposal is
        touched, because adoption is about standing, not text. Later revisions do not
        undo it either.


        There is no route back. A document other work already leans on must not
        quietly become a scratch note again, so one that turns out not to be worth
        keeping is archived with `DELETE /documents/{document_id}` instead. An
        `applied` document -- one already consumed downstream -- is refused outright
        with `422` rather than answered idempotently, because reporting success would
        say it is available to be consumed again.
      responses:
        "200":
          description: Document with its latest revision and blocks, now formal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /documents/{document_id}/decompose:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      tags: [Documents]
      operationId: decomposeDocument
      summary: Break a formal document down into a task document
      description: >
        Answers `202` with the *attempt*, not the breakdown. The model call
        takes as long as it takes, so it runs in a background job and what a
        client does next is watch.


        **Watching is the socket**, not this endpoint: join `document:{id}` on
        `/socket` (see `RintoPMOWeb.DocumentChannel`). It carries the model's
        output as it is produced -- `decomposition_output` frames whose `chunk`
        values you append in order -- and a `decomposition` frame every time the
        attempt changes state. `GET /documents/{document_id}/decomposition`
        answers the same row for a client that would rather ask than listen,
        but it cannot show the output: nothing is stored.


        The breakdown is an ordinary document. When the attempt succeeds,
        `result_document_id` names it, and it starts `draft` like anything else
        -- somebody still has to read it and adopt it.


        Refused, all of them here rather than inside the job so that a person
        clicking a button hears no while they are still looking at it:
        `document_not_formal` (only an adopted plan is worth turning into
        work), `decomposition_exists` (one breakdown at a time -- archive the
        standing one to make another), `no_decomposition_actor` (nobody holds
        the role, and unlike naming there is no fallback), and
        `decomposition_in_flight` (`409`, somebody clicked twice).
      responses:
        "202":
          description: The queued attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecompositionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: An attempt is already running for this document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /documents/{document_id}/decomposition:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Documents]
      operationId: getDocumentDecomposition
      summary: The most recent attempt to break this document down
      description: >
        `data` is `null` when the document has never been broken down. Most
        recent rather than in-flight: an attempt that failed a minute ago is
        exactly what somebody opening the page needs to see.


        This answers the row only. The model's output is broadcast as it is
        produced and kept nowhere, so a client that was not listening cannot
        get it back -- what survives is the document named by
        `result_document_id`.
      responses:
        "200":
          description: The attempt, or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecompositionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents/{document_id}/file_breakdown:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      tags: [Documents, Tasks]
      operationId: fileDocumentBreakdown
      summary: File an adopted task document as the project's work breakdown
      description: >
        The other end of `POST /documents/{document_id}/decompose`. That turned
        a plan into a document somebody could argue with; this turns the
        document they settled on into the work itself. Between them sits the
        only gate that matters -- somebody adopted it, with
        `POST /documents/{document_id}/formalize`.


        **What it reads.** A `##` with `###` under it becomes a summary node
        covering them; a `##` with none becomes one piece of work. Everything
        written under either heading becomes that task's `description`,
        acceptance criteria included -- there is no separate field for them and
        no marker inside the text. Descriptions are Markdown and have to be
        rendered as such: they contain lists, and a literal underscore in them
        is written `\_`.


        **What it does not read.** No estimates -- how long work takes is
        decided by whoever is going to do it. No ordering beyond the order
        things were written, which is the order they come back in.


        Every task's `document_id` points at the document that was *broken
        down*, not at this one: the spec somebody implements against is the
        design, not the list of work. A breakdown written by hand rather than
        generated has no source, and its tasks carry `null`.


        **Once.** The document comes out `applied` and a second call is
        refused. Tasks and that transition are one transaction, so a breakdown
        never half-lands: a task the domain rejects leaves nothing filed and
        the document still `formal`, there to be fixed and filed. Editing the
        document afterwards changes nothing about the tasks -- work that turned
        out wrong is cancelled, work that is missing comes from breaking down
        another document.
      responses:
        "201":
          description: >-
            Every task created, flat and in document order with `parent_id` on
            each -- the same shape `GET /projects/{slug}/tasks` answers with.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /documents/{document_id}/revisions:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Documents]
      operationId: listDocumentRevisions
      summary: List immutable document revisions
      responses:
        "200":
          description: Revisions ordered by descending UUIDv7 id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevisionListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Documents]
      operationId: createDocumentRevision
      summary: Create a revision by applying block operations
      requestBody:
        $ref: "#/components/requestBodies/DocumentRevisionCreate"
      responses:
        "201":
          description: Revision created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevisionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The base revision is stale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          description: Revision or block operation is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /documents/{document_id}/revisions/{revision_id}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/DocumentRevisionId"
    get:
      tags: [Documents]
      operationId: getDocumentRevision
      summary: Get an immutable revision and its blocks
      responses:
        "200":
          description: Revision details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevisionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents/{document_id}/annotations:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Annotations]
      operationId: listAnnotations
      summary: List annotations for a document
      description: Returns annotation summaries without replies.
      parameters:
        - name: block_id
          in: query
          required: false
          description: Filter by logical block id. Use `none` for annotations without a block anchor.
          schema:
            oneOf:
              - type: string
                format: uuid
              - type: string
                enum: [none]
        - name: status
          in: query
          required: false
          description: Filter by lifecycle status. Combines with `block_id`.
          schema:
            type: string
            enum: [open, resolved, dismissed]
        - name: pending_conclusion
          in: query
          required: false
          description: >
            When true, returns only annotations still `open` that carry a reply
            drawn from a conversation -- the AI has finished and a human has
            not decided. Deliberately not keyed on whether anyone has read it:
            clearing the marker on read would hide it at exactly the moment
            intervention matters most.
          schema:
            type: boolean
      responses:
        "200":
          description: Annotation summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Annotations]
      operationId: createAnnotation
      summary: Create an annotation
      requestBody:
        $ref: "#/components/requestBodies/AnnotationCreate"
      responses:
        "201":
          description: Annotation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /documents/{document_id}/annotations/{id}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/AnnotationId"
    get:
      tags: [Annotations]
      operationId: getAnnotation
      summary: Get an annotation with replies
      responses:
        "200":
          description: Annotation details including replies ordered by position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Annotations]
      operationId: updateAnnotation
      summary: Update an annotation
      requestBody:
        $ref: "#/components/requestBodies/AnnotationUpdate"
      responses:
        "200":
          description: Annotation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Annotations]
      operationId: replaceAnnotation
      summary: Update an annotation
      description: Alias of PATCH.
      requestBody:
        $ref: "#/components/requestBodies/AnnotationUpdate"
      responses:
        "200":
          description: Annotation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Annotations]
      operationId: deleteAnnotation
      summary: Delete an annotation and its replies
      responses:
        "204":
          description: Annotation deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /documents/{document_id}/annotations/{id}/resolve:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/AnnotationId"
    post:
      tags: [Annotations]
      operationId: resolveAnnotation
      summary: Mark an annotation resolved
      description: >
        Status lives behind its own actions rather than the update payload, so
        that editing an annotation's wording cannot silently close it.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationResolveInput"
      responses:
        "200":
          description: Annotation resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /documents/{document_id}/annotations/{id}/dismiss:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/AnnotationId"
    post:
      tags: [Annotations]
      operationId: dismissAnnotation
      summary: Mark an annotation dismissed
      description: >
        Considered and declined: the "no" that is not a deletion. The opinion
        and its replies survive, and the topics that discussed it keep pointing
        at something real. Clears `resolved_by_revision_id`, since no revision
        settled an annotation nobody acted on.
      responses:
        "200":
          description: Annotation dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /documents/{document_id}/annotations/{id}/reopen:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/AnnotationId"
    post:
      tags: [Annotations]
      operationId: reopenAnnotation
      summary: Return an annotation to open
      description: Clears `resolved_by_revision_id`; nothing settles the annotation any more.
      responses:
        "200":
          description: Annotation reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /documents/{document_id}/annotations/{id}/conversations:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/AnnotationId"
    get:
      tags: [Annotations]
      operationId: listAnnotationConversations
      summary: List the topics that discussed this annotation
      description: >
        Derived from message references, not from a join table. That is why an
        annotation can be under discussion in several topics at once without
        anything having to record the fact, and why the moment each topic
        pulled it into context is recoverable.
      responses:
        "200":
          description: Conversations that referenced this annotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents/{document_id}/annotations/{annotation_id}/replies:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/AnnotationNestedId"
    post:
      tags: [Annotations]
      operationId: createAnnotationReply
      summary: Append a follow-up reply
      description: Assigns the next monotonic position. Deleting earlier replies does not renumber later ones.
      requestBody:
        $ref: "#/components/requestBodies/AnnotationReplyCreate"
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationReplyResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /documents/{document_id}/annotations/{annotation_id}/replies/{reply_id}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/AnnotationNestedId"
      - $ref: "#/components/parameters/AnnotationReplyId"
    patch:
      tags: [Annotations]
      operationId: updateAnnotationReply
      summary: Update a reply's content
      description: Position is immutable.
      requestBody:
        $ref: "#/components/requestBodies/AnnotationReplyUpdate"
      responses:
        "200":
          description: Reply updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationReplyResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Annotations]
      operationId: replaceAnnotationReply
      summary: Update a reply's content
      description: Alias of PATCH. Position is immutable.
      requestBody:
        $ref: "#/components/requestBodies/AnnotationReplyUpdate"
      responses:
        "200":
          description: Reply updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationReplyResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Annotations]
      operationId: deleteAnnotationReply
      summary: Delete a reply
      description: Later reply positions are not decremented.
      responses:
        "204":
          description: Reply deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /documents/{document_id}/commit:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    post:
      tags: [Proposals]
      operationId: commitDocument
      summary: Turn the chosen proposals into a revision
      description: >
        One call, three things, one transaction: the revision is written, the
        annotations named in `resolve_annotation_ids` are resolved against it,
        and the proposals it used become `accepted`. Commit is the only moment
        at which somebody has both decided and changed the document, so it is
        the only natural place to resolve an annotation -- and a revision
        written without its resolutions, or resolutions pointing at a revision
        that failed to write, would each leave the record lying.


        Omit `block_ids` to take every block holding exactly one live proposal.
        A block with an undecided contention is refused, but only that block:
        the rest of the selection goes through.


        A commit spanning several documents is several revisions, one per
        document. There is no cross-document commit record; `source_conversation_id`
        makes "what did that discussion change?" a query instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitInput"
      responses:
        "201":
          description: Revision created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentRevisionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            The base revision is stale, or a selected block has a contention
            nobody has decided.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /documents/{document_id}/proposals:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Proposals]
      operationId: listProposals
      summary: List a document's proposals
      description: >
        Includes decided ones. Nothing is ever deleted -- "why A and not B" is
        the record this system exists to keep -- so filter by `status` to see
        only what is still standing.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [live, accepted, rejected, superseded]
        - name: block_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: conversation_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockProposalListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Proposals]
      operationId: proposeBlock
      summary: Record what a topic wants a block to say
      description: >
        A topic already holding a live proposal on the block has it rewritten
        in place rather than gaining a second one: five rounds of "tighten
        this" are one intent iterating. `status` and the decision fields are
        ignored if sent -- a proposal moves only by being decided or committed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockProposalCreateInput"
      responses:
        "201":
          description: >
            The proposal, with the number of live proposals now on that block.
            Two or more means the topic has walked into a contention.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposedResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /documents/{document_id}/proposals/{id}:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/BlockProposalId"
    get:
      tags: [Proposals]
      operationId: getProposal
      summary: Get one proposal
      responses:
        "200":
          description: Proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockProposalResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents/{document_id}/proposals/{id}/decide:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/BlockProposalId"
    post:
      tags: [Proposals]
      operationId: decideProposal
      summary: Settle a contended block in favour of this proposal
      description: >
        Every other live proposal on the block becomes `rejected`. This one
        stays `live`: deciding a contention is not committing it, and it still
        has to go through commit like any other pending change.


        The only other way out of a contention is to open a topic about it.
        There is no manual merge -- a third version nobody asked for is exactly
        what this refuses to produce.


        Who decided is the token holder and cannot be sent. Deciding is the one
        thing in this system only a person does, and `decided_by_actor_id` is
        the record of which person -- a body able to name somebody else would
        let an agent stamp its own change as agreed to.
      responses:
        "200":
          description: The adopted proposal, still live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockProposalResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /documents/{document_id}/contentions:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
    get:
      tags: [Proposals]
      operationId: listContentions
      summary: List the blocks carrying more than one live proposal
      description: >
        A contention has a place -- it is on a block -- so unlike a topic it
        can be marked on the document itself.
      responses:
        "200":
          description: Contended blocks and their competing proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentionListResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents/{document_id}/conversations/{conversation_id}/blocks:
    parameters:
      - $ref: "#/components/parameters/DocumentId"
      - $ref: "#/components/parameters/ConversationNestedId"
    get:
      tags: [Proposals]
      operationId: listConversationBlocks
      summary: Read the document as one topic sees it
      description: >
        The latest revision, with this topic's own proposals standing in, plus
        a count of anybody else's. The rival text is deliberately withheld:
        reconciling versions is the human's decision, and the count exists only
        so a topic knows it is not alone in the block.
      responses:
        "200":
          description: Blocks as this topic sees them
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationBlockListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: List topics
      parameters:
        - name: actor_id
          in: query
          required: false
          description: Filter to the topics a given actor started.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Start a topic
      description: >
        Created cold: no pi process is implied. A topic is not attached to any
        document, since one topic can span several.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCreateInput"
      responses:
        "201":
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /conversations/{id}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [Conversations]
      operationId: getConversation
      summary: Get a topic
      description: Messages are not included; read them from the messages collection.
      responses:
        "200":
          description: Conversation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Conversations]
      operationId: updateConversation
      summary: Rename a topic
      description: >
        Only the title is mutable. There is no delete -- a topic is kept
        permanently. Naming a topic here marks it as named by a person, which
        stops the automatic namer from ever replacing it.
      requestBody:
        $ref: "#/components/requestBodies/ConversationUpdate"
      responses:
        "200":
          description: Conversation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Conversations]
      operationId: replaceConversation
      summary: Rename a topic
      description: Alias of PATCH.
      requestBody:
        $ref: "#/components/requestBodies/ConversationUpdate"
      responses:
        "200":
          description: Conversation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /conversations/{id}/close:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [Conversations]
      operationId: closeConversation
      summary: Cool a topic
      description: >
        Closes the pi process carrying the topic and clears `pi_session_id`.
        Nothing is lost: every message stays, and the topic can be revived from
        them. This is also what happens when a topic is evicted to free a
        process slot.
      responses:
        "200":
          description: Conversation cooled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /conversations/{conversation_id}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationNestedId"
    get:
      tags: [Conversations]
      operationId: listMessages
      summary: List a topic's turns, oldest first
      parameters:
        - name: after_position
          in: query
          required: false
          description: Return only turns after this position, for forward paging.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Messages with their references
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Conversations]
      operationId: createMessage
      summary: Append a turn
      description: >
        Assigns the next monotonic position. `content` must be the raw text,
        never a prelude expanded from the references -- replay re-expands them
        against the documents as they stand then, rather than feeding back an
        old snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreateInput"
      responses:
        "201":
          description: Message appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /conversations/{conversation_id}/messages/{id}:
    parameters:
      - $ref: "#/components/parameters/ConversationNestedId"
      - $ref: "#/components/parameters/MessageId"
    get:
      tags: [Conversations]
      operationId: getMessage
      summary: Get one turn
      description: >
        There is no update and no delete for a message. A conversation is a
        record of what happened.
      responses:
        "200":
          description: Message details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /ai_models:
    get:
      tags: [AI Models]
      operationId: listAIModels
      summary: List supported AI providers and models
      description: >
        Returns the providers and models discovered from the local `pi --mode rpc`
        `get_available_models` catalog at application startup. Use this when creating an
        AI actor so the client can offer only currently supported provider/model pairs and
        the thinking levels each model actually supports.


        Discovery runs in the background, so `data` may be empty while it is still in
        flight or if it failed. Read `status` rather than inferring from an empty list.
      responses:
        "200":
          description: Provider and model catalog, plus discovery status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIModelCatalogResponse"
  /ai_models/refresh:
    post:
      tags: [AI Models]
      operationId: refreshAIModels
      summary: Trigger rediscovery of AI models
      description: >
        Asks the server to re-run model discovery against the local pi runtime and
        returns immediately without waiting for it. Use after installing or updating
        models, which the server otherwise picks up only on restart.


        Poll `GET /ai_models` and watch `status.loading` to observe the outcome; a
        failure appears there as `status.state = "error"`, which is why this endpoint has
        no error response of its own. A refresh already in flight absorbs the request, so
        repeated calls do not stack up. The currently cached models remain readable
        throughout, and a failed refresh leaves them untouched.
      responses:
        "204":
          description: Rediscovery has been requested
  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get a task
      description: >
        Not nested under its project: a task id is enough to name one, and an
        agent that pulled a task out of the pool holds the id, not the slug.
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Update a task's wording, spec pointer, parent, owner, or due date
      description: >
        Neither `status` nor `kind` is accepted here. Status moves only through
        the event endpoints, and `kind` only through `split`, so that fixing a
        typo cannot also complete a task or turn it into a cover.
      requestBody:
        $ref: "#/components/requestBodies/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TaskCycle"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Tasks]
      operationId: replaceTask
      summary: Update a task
      description: Alias of PATCH.
      requestBody:
        $ref: "#/components/requestBodies/TaskUpdate"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TaskCycle"
        "422":
          $ref: "#/components/responses/TaskInvalidInput"
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Remove a task outright
      description: >
        Not the opposite of create. `cancel` is what records that work was
        dropped and keeps it in the tree; this is for rows that should never
        have existed, such as a breakdown an agent got wrong.

        Refuses a node that still has children rather than scattering them to
        the root. Deleting the last child of a cover demotes that cover back to
        a `work` task, so re-read the WBS afterwards.
      responses:
        "204":
          description: Task deleted
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            `task_state_conflict`: the node still has children. Empty it first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /tasks/{id}/assign:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: assignTask
      summary: Hand a task to an actor
      description: >
        The authoritative half of distribution. Overwrites whoever held it, so
        a reassignment does not have to release first -- a handoff is one
        decision and should not be able to half-happen. Status is untouched.
      requestBody:
        $ref: "#/components/requestBodies/TaskActor"
      responses:
        "200":
          description: Task assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /tasks/{id}/claim:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: claimTask
      summary: Take an unclaimed task
      description: >
        The pull half of distribution, and the one that can lose. The check and
        the write are a single conditional UPDATE, so two agents claiming at
        once produce one winner and one refusal rather than two winners. Do not
        retry a `task_already_claimed` -- pick a different task.


        Names nobody: pulling means the claimant is the caller, and the server
        reads that from the token. `assign` is the half that still names
        somebody, because it pushes work at them.
      responses:
        "200":
          description: Task claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >
            `task_already_claimed` when someone else got there first --
            `details.assignee_id` names the winner. `task_state_conflict` when
            the task is already `done` or `cancelled`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
        "422":
          $ref: "#/components/responses/ValidationError"
  /tasks/{id}/release:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: releaseTask
      summary: Put a task back in the pool
      description: >
        Not a cancel: the work still needs doing, by someone else. Status and
        `started_at` survive, so the next owner inherits an honest record
        rather than a clock reset to hide the handoff.
      responses:
        "200":
          description: Task released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /tasks/{id}/split:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: splitTask
      summary: Turn a job into the cover over the jobs it turned out to be
      description: >
        The one thing that moves `kind`, and an operation rather than a field:
        promoting a job to a cover drops its assignee and its clocks, and that
        must not be able to ride along with an edit of the title.

        `children` is optional. The promotion is the operation -- a cover with
        nothing under it reads `open`, which is exactly true -- and existing
        tasks can be moved in afterwards by PATCHing their `parent_id`.
        Everything happens in one transaction, so a split never half-lands.

        A cover that never received children stays a cover; only *emptying* one
        demotes it. Splitting with no payload is a breakdown waiting to be
        filled in, not a no-op.

        The response carries `children` beside `data`: a caller that just broke
        a job into five needs the ids it created.
      requestBody:
        $ref: "#/components/requestBodies/TaskSplit"
      responses:
        "200":
          description: Task promoted, children created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskSplitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: >
            `task_not_splittable` when the task is already a cover, or is
            `done` or `cancelled` -- a finished job is not a container for
            unfinished work. `details.current_status` is what it actually is.
            `validation_error` when a child is invalid; `details.children` is
            keyed by the child's index in the request. `invalid_estimate` when
            a child's estimate is malformed; `details.child` is its index.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /tasks/{id}/start:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: startTask
      summary: Move a task to in_progress
      description: >
        Only from `open`, and only with an owner: starting ownerless work is
        how a task ends up in progress with nobody on it. Stamps `started_at`.
        Never applies to a summary node.
      responses:
        "200":
          description: Task started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TaskStateConflict"
  /tasks/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: completeTask
      summary: Mark a task done
      description: >
        Only from `in_progress`, and never on a summary node. Stamps
        `completed_at`. Optional `actual_minutes` records how long it took in
        the same act; absent or null leaves whatever was already stored.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCompleteInput"
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TaskStateConflict"
  /tasks/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: cancelTask
      summary: Abandon a task without deleting it
      description: >
        Reachable from every live status. Keeps `started_at` -- the difference
        between "we dropped it" and "we never began" is worth keeping -- and
        leaves `completed_at` null, because nothing was completed.
      responses:
        "200":
          description: Task cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TaskStateConflict"
  /tasks/{id}/reopen:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: reopenTask
      summary: Return a finished or abandoned task to open
      description: >
        Clears `started_at`, `completed_at`, and `actual_minutes`: the finish
        never held, and a task that is open and complete at once would make
        every count built on it pick one. Difficulty stays -- the work is the
        same work. The assignee stays.
      responses:
        "200":
          description: Task reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/TaskStateConflict"
  /tasks/{id}/estimate:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [Tasks]
      operationId: estimateTask
      summary: Have a model fill in what this node is missing
      description: >
        `kind: difficulty` rates unfilled work in Fibonacci story points;
        `kind: time` produces a three-point estimate, calibrated with completed
        work from the same project (difficulty, the estimate given then, and
        `actual_minutes`). One endpoint rather than two: the two differ in the
        question put to the model and in nothing else.


        Unlike `start` / `complete` / `cancel` above, which are events on a
        state machine and get a route each, this is one operation with a
        parameter. `kind` is required -- there is no sensible default between
        the two, and guessing would spend a model call on the question nobody
        asked.


        The target is the task in the path. A work item is estimated itself; a
        summary is estimated as the work under it that still has no value.
        Which work is targeted is decided when the job *starts*, so a value
        somebody types while the model is thinking will be written over --
        deliberate, and a `PATCH` away from fixed.


        Answers `202` with the *job*, not the numbers. Note the two ids: the
        one in the path is the task's `uuid`, the one in `data` is an integer
        Oban job id.


        **Nothing records the asking.** There is no attempt resource and no
        history: what an estimation leaves behind is the numbers on the tasks.
        The job id is the only handle there is -- keep it.


        **Watching is the socket**: join `task:{id}` on `/socket` (see
        `RintoPMOWeb.TaskChannel`). One `estimation` frame arrives when the job
        is over, for both kinds, told apart by `kind`. There is no progress
        frame and no output frame -- the answer is numbers, not prose.


        **If you were not listening**, ask `GET /jobs/{job_id}`. A `404` there
        means the job has been pruned, which only happens to jobs that are
        over: stop waiting and re-read the task.


        Asking twice is allowed. This is a helper for somebody looking at an
        empty field, not an authority on what belongs in it -- a later answer
        may overwrite an earlier one, and neither claims to be the better one.
        A double-click is not two model calls, though: while one of this kind
        is in flight, this answers with the job already queued. The two kinds
        are separate slots and one of each may run at once.


        Refused before anything is queued: `bad_request` (no `kind`, or one
        that is not `difficulty` or `time`), `nothing_to_estimate` (every work
        item already has a value, or the cover has no work), and
        `no_estimation_actor` (nobody holds the role, and unlike naming there
        is no fallback).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskEstimationInput"
      responses:
        "202":
          description: The queued job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
  /jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: The `id` a `202` handed back.
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Whether the job this id names is still going
      description: >
        The way back for a client that started something, lost its connection,
        and came back holding an id. The socket is the normal way to find out;
        this is what to ask when the message went out while nobody was
        listening.


        `404` means the job has been pruned, and pruning only reaches jobs that
        are over. Read it as "stop waiting and re-read the resource", not as an
        error to report.


        Eight queue states collapse into three: anything not yet finished is
        `running`, `completed` is `succeeded`, and `discarded` or `cancelled`
        is `failed`. Nothing the worker put in `args` or `meta` comes back out.
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /attachments:
    post:
      tags: [Attachments]
      operationId: createAttachment
      summary: Upload an image
      description: >
        Accepts `multipart/form-data` rather than base64 JSON: base64 is a third
        larger and would have to be decoded before anything could be validated.


        Format and dimensions are read from the bytes themselves, so the
        uploaded filename and `Content-Type` do not influence the stored
        `mime_type`. Only the formats a model accepts inline are stored --
        PNG, JPEG, GIF, WebP.


        Nothing is resized. An image over the pixel or byte limit is refused,
        not shrunk, so downscale client-side before uploading; large images also
        cost tokens on every turn they stay in the conversation.
      requestBody:
        $ref: "#/components/requestBodies/AttachmentCreate"
      responses:
        "201":
          description: Attachment stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "413":
          $ref: "#/components/responses/ImageTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedImage"
        "422":
          $ref: "#/components/responses/ValidationError"
  /attachments/{id}:
    parameters:
      - $ref: "#/components/parameters/AttachmentId"
    get:
      tags: [Attachments]
      operationId: getAttachment
      summary: Get attachment metadata
      description: Metadata only. The bytes are served by the content endpoint.
      responses:
        "200":
          description: Attachment metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Attachments]
      operationId: deleteAttachment
      summary: Delete an attachment
      description: >
        Removes the metadata and the stored bytes. Chat messages that already
        referenced it keep the copy pi received; only future references break.
      responses:
        "204":
          description: Attachment deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /attachments/{id}/content:
    parameters:
      - $ref: "#/components/parameters/AttachmentId"
    get:
      tags: [Attachments]
      operationId: getAttachmentContent
      summary: Download the image bytes
      description: >
        Served with `Content-Disposition: inline` so it can back an `<img>` tag
        directly. This is for rendering a transcript after a reload, when the
        client holds attachment ids but no longer holds the bytes.
      responses:
        "200":
          description: Raw image bytes
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: The stored bytes are missing or unreadable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIError"
  /repo_credentials:
    get:
      tags: [Repo Credentials]
      operationId: listRepoCredentials
      summary: List repository credentials
      responses:
        "200":
          description: Repository credential list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoCredentialListResponse"
    post:
      tags: [Repo Credentials]
      operationId: createRepoCredential
      summary: Create a repository credential
      requestBody:
        $ref: "#/components/requestBodies/RepoCredentialCreate"
      responses:
        "201":
          description: Repository credential created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoCredentialResponse"
        "422":
          $ref: "#/components/responses/ValidationError"
  /repo_credentials/{id}:
    parameters:
      - $ref: "#/components/parameters/RepoCredentialId"
    get:
      tags: [Repo Credentials]
      operationId: getRepoCredential
      summary: Get a repository credential
      responses:
        "200":
          description: Repository credential details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoCredentialResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Repo Credentials]
      operationId: updateRepoCredential
      summary: Update a repository credential
      description: Omitting token retains its current value.
      requestBody:
        $ref: "#/components/requestBodies/RepoCredentialUpdate"
      responses:
        "200":
          description: Repository credential updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoCredentialResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    put:
      tags: [Repo Credentials]
      operationId: replaceRepoCredential
      summary: Update a repository credential
      description: Alias of PATCH. Omitting token retains its current value.
      requestBody:
        $ref: "#/components/requestBodies/RepoCredentialUpdate"
      responses:
        "200":
          description: Repository credential updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepoCredentialResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Repo Credentials]
      operationId: deleteRepoCredential
      summary: Delete a repository credential
      description: Repository references are set to null.
      responses:
        "204":
          description: Repository credential deleted
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    ActorToken:
      type: http
      scheme: bearer
      description: >
        The token the server was started with as `RINTO_TOKEN`. It is agreed in
        advance rather than issued, so a client is configured with it by hand
        -- `rinto-pmo config init` asks for it -- and no endpoint returns one.


        Only the `Bearer` scheme is read: a bare token in the header, or one in
        the query string, would end up in access logs and in the shell history
        of anyone who copied the URL.
  requestBodies:
    ProjectCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectCreateInput"
    ProjectUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectUpdateInput"
    ProjectRepoCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectRepoCreateInput"
    ProjectRepoUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProjectRepoUpdateInput"
    TaskCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TaskCreateInput"
    TaskUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TaskUpdateInput"
    TaskSplit:
      required: false
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TaskSplitInput"
    TaskActor:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TaskActorInput"
    DocumentCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DocumentCreateInput"
    DocumentRevisionCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DocumentRevisionCreateInput"
    RepoCredentialCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RepoCredentialCreateInput"
    RepoCredentialUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RepoCredentialUpdateInput"
    AnnotationCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnnotationCreateInput"
    AnnotationUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnnotationUpdateInput"
    ConversationUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConversationUpdateInput"
    AnnotationReplyCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnnotationReplyCreateInput"
    AttachmentCreate:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: "#/components/schemas/AttachmentCreateInput"
          encoding:
            file:
              contentType: image/png, image/jpeg, image/gif, image/webp
    AnnotationReplyUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnnotationReplyUpdateInput"
  parameters:
    SettingKey:
      name: key
      in: path
      required: true
      description: The system-wide role being filled.
      schema:
        type: string
        enum: [title_actor, decomposition_actor, estimation_actor]
    ActorId:
      name: id
      in: path
      required: true
      description: Actor UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    ProjectSlug:
      name: slug
      in: path
      required: true
      description: Unique project slug.
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    DocumentId:
      name: document_id
      in: path
      required: true
      description: Document UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    DocumentRevisionId:
      name: revision_id
      in: path
      required: true
      description: Document revision UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    ProjectRepoId:
      name: id
      in: path
      required: true
      description: Project repository UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    TaskId:
      name: id
      in: path
      required: true
      description: Task UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    RepoCredentialId:
      name: id
      in: path
      required: true
      description: Repository credential UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    AnnotationId:
      name: id
      in: path
      required: true
      description: Annotation UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    AnnotationNestedId:
      name: annotation_id
      in: path
      required: true
      description: Parent annotation UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    AnnotationReplyId:
      name: reply_id
      in: path
      required: true
      description: Annotation reply UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    BlockProposalId:
      name: id
      in: path
      required: true
      description: Block proposal UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    ConversationId:
      name: id
      in: path
      required: true
      description: Conversation UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    ConversationNestedId:
      name: conversation_id
      in: path
      required: true
      description: Parent conversation UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    MessageId:
      name: id
      in: path
      required: true
      description: Message UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: id
      in: path
      required: true
      description: Attachment UUIDv7 identifier.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Unauthorized:
      description: >
        Three codes, because they are three different people's problems.
        `unauthorized`: the request carried no token, or not the configured one
        -- the caller's. `token_not_configured`: the server was started without
        `RINTO_TOKEN`, so it has nothing to check against and answers nothing.
        `human_actor_missing`: the token is right, but nobody has run
        `mix rinto.actors.setup_human` against this database, so there is no
        person for the request to be answered as.


        Told apart deliberately. The two operator-facing codes describe an
        installation with nothing in it to protect, and saying so saves an
        afternoon of looking for a client bug.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    ValidationError:
      description: >
        Request validation failed.


        Any endpoint that accepts a body may also refuse it with
        `unresolvable_references` at this status: the body contains a
        `rinto://` address of a known type that points at nothing. The offending
        addresses come back in `details.uris`, so whoever wrote them can fix
        those rather than re-read the whole document. See the References tag.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
    TaskStateConflict:
      description: >
        `task_state_conflict`: the event does not apply to the task's current
        status, `start` was asked of a task nobody owns, or the target is a
        summary node, whose status is not its own to move. `details` carries
        the observed `status`, and `kind` when a summary node was the cause.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    TaskInvalidInput:
      description: >
        `validation_error` for a field-level problem, or `invalid_estimate`
        when the three-point estimate is partial, out of order, negative, or
        set on a summary node. `details` carries `field` and `reason`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    TaskCycle:
      description: >
        `dependency_cycle`: the parent would sit underneath the task being
        given it. `details.cycle` is the chain that would close.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    ImageTooLarge:
      description: The image exceeds the byte or pixel limit accepted for inline use
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    UnsupportedImage:
      description: The file is not an image format a model accepts inline
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
  schemas:
    ActorKind:
      type: string
      enum: [human, ai]
    ThinkingLevel:
      type: string
      minLength: 1
      description: >
        Provider-specific thinking/reasoning level id as reported by pi
        (for example off, high, max). Not a fixed global enum.
    AIModel:
      type: object
      required: [model, context_window, max_output, thinking, thinking_levels, images]
      properties:
        model:
          type: string
          description: Model id as reported by pi.
        name:
          type: string
          nullable: true
          description: Display name from pi, when available.
        context_window:
          type: integer
          minimum: 1
        max_output:
          type: integer
          minimum: 1
        thinking:
          type: boolean
          description: Whether the model supports extended thinking/reasoning.
        thinking_levels:
          type: array
          description: Thinking levels supported by this model (from pi thinkingLevelMap).
          items:
            $ref: "#/components/schemas/ThinkingLevel"
        images:
          type: boolean
      additionalProperties: false
    AIProviderModels:
      type: object
      required: [provider, models]
      properties:
        provider:
          type: string
        models:
          type: array
          items:
            $ref: "#/components/schemas/AIModel"
      additionalProperties: false
    AIModelCatalogResponse:
      type: object
      required: [data, status]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AIProviderModels"
        status:
          $ref: "#/components/schemas/AIModelCatalogStatus"
      additionalProperties: false
    AIModelCatalogStatus:
      type: object
      required: [state, loading, updated_at, error]
      description: >
        Whether the catalog in `data` is usable, and whether discovery is running.
        `state` and `loading` are independent: a refresh keeps serving the models it is
        replacing, so `state: ok` with `loading: true` means usable but being updated.
      properties:
        state:
          type: string
          enum: [not_loaded, ok, error]
          description: >
            Outcome of the last finished discovery. `not_loaded` means none has finished
            yet, so an empty `data` says nothing about whether pi is available.
        loading:
          type: boolean
          description: Whether a discovery is running right now. Poll until false.
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: When the catalog was last loaded successfully.
        error:
          type: string
          nullable: true
          description: >
            Why the last discovery failed, for display to an operator. Diagnostic text,
            not a stable code -- branch on `state` instead.
      additionalProperties: false
    Actor:
      type: object
      required: [id, kind, name, enabled]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier.
        kind:
          $ref: "#/components/schemas/ActorKind"
        name:
          type: string
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        thinking_level:
          allOf:
            - $ref: "#/components/schemas/ThinkingLevel"
          nullable: true
          description: Free-form level string for AI actors; must match a level exposed by the selected model.
        system_prompt:
          type: string
          nullable: true
        injection_profile:
          type: object
          nullable: true
          additionalProperties: true
        inserted_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    HumanActorCreateInput:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [human]
        name:
          type: string
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
          default: true
      additionalProperties: false
    AIActorCreateInput:
      type: object
      required: [kind, name, provider, model, thinking_level]
      properties:
        kind:
          type: string
          enum: [ai]
        name:
          type: string
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
          default: true
        provider:
          type: string
        model:
          type: string
        thinking_level:
          $ref: "#/components/schemas/ThinkingLevel"
        system_prompt:
          type: string
          nullable: true
        injection_profile:
          type: object
          nullable: true
          additionalProperties: true
      additionalProperties: false
    ActorCreateInput:
      oneOf:
        - $ref: "#/components/schemas/HumanActorCreateInput"
        - $ref: "#/components/schemas/AIActorCreateInput"
      discriminator:
        propertyName: kind
        mapping:
          human: "#/components/schemas/HumanActorCreateInput"
          ai: "#/components/schemas/AIActorCreateInput"
    ActorUpdateInput:
      type: object
      properties:
        kind:
          allOf:
            - $ref: "#/components/schemas/ActorKind"
          description: May be supplied unchanged; changing it is rejected.
        name:
          type: string
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
        provider:
          type: string
        model:
          type: string
        thinking_level:
          $ref: "#/components/schemas/ThinkingLevel"
        system_prompt:
          type: string
          nullable: true
        injection_profile:
          type: object
          nullable: true
          additionalProperties: true
      additionalProperties: false
    ActorResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Actor"
      additionalProperties: false
    ActorListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Actor"
      additionalProperties: false
    ProjectStatus:
      type: string
      enum: [active, archived]
    ProjectSummary:
      type: object
      required: [id, name, slug, description, status]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier.
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"
        inserted_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    Project:
      type: object
      required: [id, name, slug, description, status, repos]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier.
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"
        repos:
          type: array
          items:
            $ref: "#/components/schemas/ProjectRepo"
        inserted_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    ProjectCreateInput:
      type: object
      required: [name, slug, description]
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
      additionalProperties: false
    ProjectUpdateInput:
      type: object
      description: Project status is not writable. Use DELETE to archive.
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
      additionalProperties: false
    ProjectResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Project"
      additionalProperties: false
    ProjectListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
      additionalProperties: false
    InsertAfterBlockOperation:
      type: object
      required: [op, after_block_id, actor_id, content]
      properties:
        op:
          type: string
          enum: [insert_after]
        after_block_id:
          type: string
          format: uuid
          nullable: true
          description: Null inserts the new block first.
        actor_id:
          type: string
          format: uuid
        content:
          type: string
      additionalProperties: false
    UpdateBlockOperation:
      type: object
      required: [op, block_id, actor_id, content]
      properties:
        op:
          type: string
          enum: [update]
        block_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        content:
          type: string
      additionalProperties: false
    MoveAfterBlockOperation:
      type: object
      required: [op, block_id, after_block_id]
      properties:
        op:
          type: string
          enum: [move_after]
        block_id:
          type: string
          format: uuid
        after_block_id:
          type: string
          format: uuid
          nullable: true
          description: Null moves the block first.
      additionalProperties: false
    DeleteBlockOperation:
      type: object
      required: [op, block_id]
      properties:
        op:
          type: string
          enum: [delete]
        block_id:
          type: string
          format: uuid
      additionalProperties: false
    DocumentBlockOperation:
      oneOf:
        - $ref: "#/components/schemas/InsertAfterBlockOperation"
        - $ref: "#/components/schemas/UpdateBlockOperation"
        - $ref: "#/components/schemas/MoveAfterBlockOperation"
        - $ref: "#/components/schemas/DeleteBlockOperation"
      discriminator:
        propertyName: op
        mapping:
          insert_after: "#/components/schemas/InsertAfterBlockOperation"
          update: "#/components/schemas/UpdateBlockOperation"
          move_after: "#/components/schemas/MoveAfterBlockOperation"
          delete: "#/components/schemas/DeleteBlockOperation"
    DocumentCreateInput:
      type: object
      required: [title]
      properties:
        project_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Optional. Omitting it, or sending null, files the document in the
            project reserved as the default (slug `personal`) rather than
            leaving it belonging to nothing -- most notes are not written with
            a project in mind, and a document filed nowhere is one nothing
            lists. Sending one still wins.


            `422 default_project_missing` when that project does not exist,
            which means the reserved slug has been renamed or
            `mix rinto.actors.setup_human` was never run.
        title:
          type: string
          minLength: 1
          description: >-
            The only source of the document title. It is never read out of the body,
            so an H1 in the body is ordinary content and a body may carry several.
        change_summary:
          type: string
          nullable: true
        actor_id:
          type: string
          format: uuid
          description: >-
            Who the body is credited to. Required whenever `markdown` produces at
            least one block; every block of a new document is credited to this actor.
        markdown:
          type: string
          description: >-
            The document body as one Markdown document. The server cuts it into
            blocks at every top-level H1, H2 and H3 heading; H4 and deeper stay with
            their section, and headings inside code blocks, lists or block quotes do
            not cut. Blocks are stored as Markdown re-rendered from the parsed
            document, so formatting is normalised. Use
            `POST /documents/preview_blocks` to see the split before creating anything.
      additionalProperties: false
    BacklinksResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [total, groups]
          properties:
            total:
              type: integer
              description: References found, across all groups.
            groups:
              type: array
              description: >
                Grouped by the kind of place the text lives, ordered by that
                kind. A backlink panel reads as sections; a client that wanted a
                flat list can concatenate, while one that wanted sections out of
                a flat list would have to group it back itself.
              items:
                $ref: "#/components/schemas/BacklinkGroup"
    BacklinkGroup:
      type: object
      required: [source_type, count, entries]
      properties:
        source_type:
          type: string
          enum: [document_block, annotation, annotation_reply, task, message]
          description: The kind of place the referring text lives.
        count:
          type: integer
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Backlink"
    Backlink:
      type: object
      required: [source_type, source_id, label, position, archived]
      properties:
        source_type:
          type: string
        source_id:
          type: string
          format: uuid
          description: >
            The referring thing. For `document_block` this is the block's stable
            `block_id`, not a per-revision row id.
        document_id:
          type: string
          format: uuid
          nullable: true
          description: The document the referring text lives in, where it lives in one.
        document_title:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
          description: >
            What to name the source in a list: the document's title for a block,
            an annotation or a reply; the task's title for a task; the topic's
            title for a message.
        excerpt:
          type: string
          nullable: true
          description: >
            The referring text, truncated. Always absent for a message: a
            transcript quoted out of context reads as a conclusion, which is the
            same reason a conversation is linkable but never expandable.
        label:
          type: string
          description: >
            The link text as written. This is what to show a reader when the
            target itself is gone.
        position:
          type: integer
          description: >
            Where the reference falls in its source's own text. Two references
            from one source to one target are two entries with different
            positions -- they are not deduplicated, because collapsing them would
            lose which mention was which.
        archived:
          type: boolean
          description: >
            Whether the document carrying the source has been archived. Flagged
            rather than filtered: archiving is not deleting, and the reference is
            still real.
    SearchResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
    SearchResult:
      type: object
      required: [uri, type, score, archived]
      properties:
        uri:
          type: string
          description: >
            The canonical address of the result. Paste it into a body, or hand it
            to `POST /references/resolve` or `GET /backlinks` unchanged.
          example: "rinto://block/01936f2a-1c4e-7c3a-9f1b-2d4e6a8b0c1d"
        type:
          type: string
          description: The kind of thing found, matching the `type` asked for.
        title:
          type: string
          nullable: true
          description: The result's name. For a block, its heading; for an annotation, its document's title.
        excerpt:
          type: string
          nullable: true
          description: The text that matched, truncated. Enough to see why it was returned.
        document_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The document a block or annotation belongs to. Present so that
            following a hit does not need a second call, the same second level
            the reference resolver and backlinks hand back.
        document_title:
          type: string
          nullable: true
        score:
          type: number
          format: float
          description: >
            The reranker's score, higher being better. Not a cosine distance, and
            on the model's own scale -- useful for ordering within one response,
            not as a threshold across queries.
        archived:
          type: boolean
          description: Whether the result, or the document carrying it, has been archived.
    ResolveReferencesInput:
      type: object
      required: [uris]
      properties:
        uris:
          type: array
          description: >
            The `rinto://` URIs to resolve. Anything that is not one still gets a
            result, with `state: invalid` -- one mistyped reference in a long body
            must not take the other links down with it.
          items:
            type: string
            example: "rinto://task/01936f2a-1c4e-7c3a-9f1b-2d4e6a8b0c1d"
    ResolveReferencesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedReference"
    ResolvedReference:
      type: object
      required: [uri, type, state, archived]
      properties:
        uri:
          type: string
          description: The URI asked about, echoed back so results need no positional bookkeeping.
        type:
          type: string
          nullable: true
          description: >
            The addressed type, or `null` when the URI did not parse. One of
            `project`, `document`, `block`, `annotation`, `proposal`, `task`,
            `conversation`, `attachment` -- or a type this build does not know,
            which is reported rather than refused.
          example: task
        state:
          type: string
          enum: [ok, broken, unknown_type, invalid]
          description: >
            `ok` -- resolved and present.


            `broken` -- a known type, correctly addressed, that is not there any
            more. Render the link degraded. This is the only state that should say
            something was deleted.


            `unknown_type` -- well-formed, naming a type this build has no notion
            of. Render as plain text and say nothing: the address may well be good,
            and text mentioning a kind of thing that does not exist yet still saves.


            `invalid` -- not a well-formed `rinto://` URI at all. Render as plain
            text; the address was never good, which is a different thing to fix.
        title:
          type: string
          nullable: true
          description: The target's name. For a block, its heading.
        subtitle:
          type: string
          nullable: true
          description: >
            A one-line qualifier for a preview -- a status, a document title, a
            mime type. Absent for a conversation, which gives up only its title.
        excerpt:
          type: string
          nullable: true
          description: >
            The opening of the target's body, truncated. Enough to tell two similar
            things apart in a hover card, never a substitute for opening the thing.
            Always absent for a conversation: a topic is a transcript, and half of
            one shown as a preview reads as a conclusion.
        document_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The document a block, annotation, or proposal sits in. Present because
            following one of those means opening that document -- a fact about the
            resources, not a route -- and a client should not need a second call to
            learn which document it is.
        document_title:
          type: string
          nullable: true
          description: The title of that document.
        archived:
          type: boolean
          description: >
            Whether the target, or the document carrying it, has been archived.
            Archiving is not deleting: the body is still there, so this stays
            `state: ok`. Render it muted rather than broken.
    DocumentPreviewBlocksInput:
