              contentType: image/png, image/jpeg, image/gif, image/webp
    AnnotationReplyUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AnnotationReplyUpdateInput"
  parameters:
    # The task filters are shared by `GET /tasks` and
    # `GET /projects/{project_slug}/tasks`: the two lists differ only in what
    # they read, and a filter that existed on one of them would be a trap.
    TaskKindFilter:
      name: kind
      in: query
      required: false
      description: >
        Filter to real work or to summary nodes. The claimable pool is
        `kind=work&assignee_id=none&live=true` -- without `kind`, covers come
        back too, and nobody can pick one up.
      schema:
        $ref: "#/components/schemas/TaskKind"
    TaskStatusFilter:
      name: status
      in: query
      required: false
      description: >
        Filter by exactly one status. On summary nodes this matches the
        rollup, not the stored column.
      schema:
        $ref: "#/components/schemas/TaskStatus"
    TaskParentFilter:
      name: parent_id
      in: query
      required: false
      description: >
        Filter by position in the tree. Use `none` for the roots -- the top
        level of the WBS.
      schema:
        oneOf:
          - type: string
            format: uuid
          - type: string
            enum: [none]
    TaskAssigneeFilter:
      name: assignee_id
      in: query
      required: false
      description: >
        Filter by owner. Use `none` for the claimable pool -- it has to be
        spelled, because an absent parameter already means "no filter".
      schema:
        oneOf:
          - type: string
            format: uuid
          - type: string
            enum: [none]
    TaskDocumentFilter:
      name: document_id
      in: query
      required: false
      description: Filter by the document a task implements against.
      schema:
        type: string
        format: uuid
    TaskLiveFilter:
      name: live
      in: query
      required: false
      description: >
        When true, only outstanding work (`open`, `in_progress`); when false,
        only `done` and `cancelled`.
      schema:
        type: boolean
    TaskOverdueFilter:
      name: overdue
      in: query
      required: false
      description: >
        When true, only outstanding tasks whose `due_on` has passed. A task
        delivered late was late; it is not still late, so finished work is
        never overdue.
      schema:
        type: boolean
    TaskPriorityFilter:
      name: priority
      in: query
      required: false
      description: Filter to one priority level, 1 highest.
      schema:
        type: integer
        enum: [1, 2, 3, 4, 5]
    TaskScheduledFilter:
      name: scheduled
      in: query
      required: false
      description: >
        When true, only work selected into a week; when false, the backlog.
        This is the filter that answers "what is not in the plan", and it is a
        filter rather than a status for the same reason there is no `backlog`
        status: which slot of the plan a task sits in is a many-valued
        question, and `planned_start_on` is the column that answers it.
      schema:
        type: boolean
    TaskSortFilter:
      name: sort
      in: query
      required: false
      description: >
        `oldest` (the default) is a backlog read from the front. `plan` is the
        order `GET /schedule` fills a week in -- priority, then the day the
        task was selected for, then age -- so the first row is the one the
        plan would reach next. It is the packer's own ordering rather than a
        second rule that agrees with it on the easy cases.
      schema:
        type: string
        enum: [oldest, plan]
        default: oldest
    SettingKey:
      name: key
      in: path
      required: true
      description: The system-wide role being filled.
      schema:
        type: string
        enum: [title_actor, decomposition_actor, estimation_actor, annotation_actor]
    ActorId:
      name: id
      in: path
      required: true
      description: Actor UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    ProjectSlug:
      name: slug
      in: path
      required: true
      description: Unique project slug.
      schema:
        type: string
        pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
    DocumentId:
      name: document_id
      in: path
      required: true
      description: Document UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    DocumentRevisionId:
      name: revision_id
      in: path
      required: true
      description: Document revision UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    ProjectRepoId:
      name: id
      in: path
      required: true
      description: Project repository UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    TaskId:
      name: id
      in: path
      required: true
      description: Task UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    RepoCredentialId:
      name: id
      in: path
      required: true
      description: Repository credential UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    AnnotationId:
      name: id
      in: path
      required: true
      description: Annotation UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    AnnotationNestedId:
      name: annotation_id
      in: path
      required: true
      description: Parent annotation UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    AnnotationReplyId:
      name: reply_id
      in: path
      required: true
      description: Annotation reply UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    BlockProposalId:
      name: id
      in: path
      required: true
      description: Block proposal UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    ConversationId:
      name: id
      in: path
      required: true
      description: Conversation UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    ConversationNestedId:
      name: conversation_id
      in: path
      required: true
      description: Parent conversation UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    MessageId:
      name: id
      in: path
      required: true
      description: Message UUIDv7 identifier.
      schema:
        type: string
        format: uuid
    AttachmentId:
      name: id
      in: path
      required: true
      description: Attachment UUIDv7 identifier.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    Unauthorized:
      description: >
        Three codes, because they are three different people's problems.
        `unauthorized`: the request carried no token, or not the configured one
        -- the caller's. `token_not_configured`: the server was started without
        `RINTO_TOKEN`, so it has nothing to check against and answers nothing.
        `human_actor_missing`: the token is right, but nobody has run
        `mix rinto.actors.setup_human` against this database, so there is no
        person for the request to be answered as.


        Told apart deliberately. The two operator-facing codes describe an
        installation with nothing in it to protect, and saying so saves an
        afternoon of looking for a client bug.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    ValidationError:
      description: >
        Request validation failed.


        Any endpoint that accepts a body may also refuse it with
        `unresolvable_references` at this status: the body contains a
        `rinto://` address of a known type that points at nothing. The offending
        addresses come back in `details.uris`, so whoever wrote them can fix
        those rather than re-read the whole document. See the References tag.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
    TaskStateConflict:
      description: >
        `task_state_conflict`: the event does not apply to the task's current
        status, `start` or `complete` was asked of a task nobody owns, or the
        target is a summary node, whose status is not its own to move.
        `details` carries the observed `status`, and `kind` when a summary node
        was the cause.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    TaskNotYours:
      description: >
        `task_not_yours`: the work is assigned to a different actor, and
        `details.assignee_id` names them. Doing the work and finishing it are
        the assignee's acts, so `start`, `complete` and `release` refuse for
        anybody else.


        Told apart from `task_already_claimed` on purpose. That one is a race
        you lost, and the answer is to pick a different task. This one means
        the task was never yours to move: re-reading state will not change it,
        so claim something from the pool, or check the id.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    TaskInvalidInput:
      description: >
        `validation_error` for a field-level problem, or `invalid_estimate`
        when the three-point estimate is partial, out of order, negative, or
        set on a summary node. `details` carries `field` and `reason`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    TaskCycle:
      description: >
        `dependency_cycle`: the parent would sit underneath the task being
        given it. `details.cycle` is the chain that would close.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    ImageTooLarge:
      description: The image exceeds the byte or pixel limit accepted for inline use
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    UnsupportedImage:
      description: The file is not an image format a model accepts inline
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
  schemas:
    ActorKind:
      type: string
      enum: [human, ai]
    ThinkingLevel:
      type: string
      minLength: 1
      description: >
        Provider-specific thinking/reasoning level id as reported by pi
        (for example off, high, max). Not a fixed global enum.
    AIModel:
      type: object
      required: [model, context_window, max_output, thinking, thinking_levels, images]
      properties:
        model:
          type: string
          description: Model id as reported by pi.
        name:
          type: string
          nullable: true
          description: Display name from pi, when available.
        context_window:
          type: integer
          minimum: 1
        max_output:
          type: integer
          minimum: 1
        thinking:
          type: boolean
          description: Whether the model supports extended thinking/reasoning.
        thinking_levels:
          type: array
          description: Thinking levels supported by this model (from pi thinkingLevelMap).
          items:
            $ref: "#/components/schemas/ThinkingLevel"
        images:
          type: boolean
      additionalProperties: false
    AIProviderModels:
      type: object
      required: [provider, models]
      properties:
        provider:
          type: string
        models:
          type: array
          items:
            $ref: "#/components/schemas/AIModel"
      additionalProperties: false
    AIModelCatalogResponse:
      type: object
      required: [data, status]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AIProviderModels"
        status:
          $ref: "#/components/schemas/AIModelCatalogStatus"
      additionalProperties: false
    AIModelCatalogStatus:
      type: object
      required: [state, loading, updated_at, error]
      description: >
        Whether the catalog in `data` is usable, and whether discovery is running.
        `state` and `loading` are independent: a refresh keeps serving the models it is
        replacing, so `state: ok` with `loading: true` means usable but being updated.
      properties:
        state:
          type: string
          enum: [not_loaded, ok, error]
          description: >
            Outcome of the last finished discovery. `not_loaded` means none has finished
            yet, so an empty `data` says nothing about whether pi is available.
        loading:
          type: boolean
          description: Whether a discovery is running right now. Poll until false.
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: When the catalog was last loaded successfully.
        error:
          type: string
          nullable: true
          description: >
            Why the last discovery failed, for display to an operator. Diagnostic text,
            not a stable code -- branch on `state` instead.
      additionalProperties: false
    Actor:
      type: object
      required: [id, kind, name, enabled]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier.
        kind:
          $ref: "#/components/schemas/ActorKind"
        name:
          type: string
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        thinking_level:
          allOf:
            - $ref: "#/components/schemas/ThinkingLevel"
          nullable: true
          description: Free-form level string for AI actors; must match a level exposed by the selected model.
        system_prompt:
          type: string
          nullable: true
        injection_profile:
          type: object
          nullable: true
          additionalProperties: true
        inserted_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    HumanActorCreateInput:
      type: object
      required: [kind, name]
      properties:
        kind:
          type: string
          enum: [human]
        name:
          type: string
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
          default: true
      additionalProperties: false
    AIActorCreateInput:
      type: object
      required: [kind, name, provider, model, thinking_level]
      properties:
        kind:
          type: string
          enum: [ai]
        name:
          type: string
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
          default: true
        provider:
          type: string
        model:
          type: string
        thinking_level:
          $ref: "#/components/schemas/ThinkingLevel"
        system_prompt:
          type: string
          nullable: true
        injection_profile:
          type: object
          nullable: true
          additionalProperties: true
      additionalProperties: false
    ActorCreateInput:
      oneOf:
        - $ref: "#/components/schemas/HumanActorCreateInput"
        - $ref: "#/components/schemas/AIActorCreateInput"
      discriminator:
        propertyName: kind
        mapping:
          human: "#/components/schemas/HumanActorCreateInput"
          ai: "#/components/schemas/AIActorCreateInput"
    ActorUpdateInput:
      type: object
      properties:
        kind:
          allOf:
            - $ref: "#/components/schemas/ActorKind"
          description: May be supplied unchanged; changing it is rejected.
        name:
          type: string
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
        provider:
          type: string
        model:
          type: string
        thinking_level:
          $ref: "#/components/schemas/ThinkingLevel"
        system_prompt:
          type: string
          nullable: true
        injection_profile:
          type: object
          nullable: true
          additionalProperties: true
      additionalProperties: false
    ActorResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Actor"
      additionalProperties: false
    ActorListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Actor"
      additionalProperties: false
    ProjectStatus:
      type: string
      enum: [active, archived]
    ProjectSummary:
      type: object
      required: [id, name, slug, description, status]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier.
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"
        inserted_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    Project:
      type: object
      required: [id, name, slug, description, status, repos]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier.
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
        status:
          $ref: "#/components/schemas/ProjectStatus"
        repos:
          type: array
          items:
            $ref: "#/components/schemas/ProjectRepo"
        inserted_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    ProjectCreateInput:
      type: object
      required: [name, slug, description]
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
      additionalProperties: false
    ProjectUpdateInput:
      type: object
      description: >-
        Project status is not writable. Use DELETE to archive.


        Neither is `slug`, which is fixed when the project is created: document
        and task bodies address a project as `rinto://project/{slug}`, carrying
        the slug as written, so a rename would break every reference already
        written and nothing could repair them. Sending the slug the project
        already has is accepted and does nothing; sending a different one is a
        422 rather than a silently ignored field.
      properties:
        name:
          type: string
        description:
          type: string
      additionalProperties: false
    ProjectResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Project"
      additionalProperties: false
    ProjectListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProjectSummary"
      additionalProperties: false
    InsertAfterBlockOperation:
      type: object
      required: [op, after_block_id, actor_id, content]
      properties:
        op:
          type: string
          enum: [insert_after]
        after_block_id:
          type: string
          format: uuid
          nullable: true
          description: Null inserts the new block first.
        actor_id:
          type: string
          format: uuid
        content:
          type: string
      additionalProperties: false
    UpdateBlockOperation:
      type: object
      required: [op, block_id, actor_id, content]
      properties:
        op:
          type: string
          enum: [update]
        block_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        content:
          type: string
      additionalProperties: false
    MoveAfterBlockOperation:
      type: object
      required: [op, block_id, after_block_id]
      properties:
        op:
          type: string
          enum: [move_after]
        block_id:
          type: string
          format: uuid
        after_block_id:
          type: string
          format: uuid
          nullable: true
          description: Null moves the block first.
      additionalProperties: false
    DeleteBlockOperation:
      type: object
      required: [op, block_id]
      properties:
        op:
          type: string
          enum: [delete]
        block_id:
          type: string
          format: uuid
      additionalProperties: false
    DocumentBlockOperation:
      oneOf:
        - $ref: "#/components/schemas/InsertAfterBlockOperation"
        - $ref: "#/components/schemas/UpdateBlockOperation"
        - $ref: "#/components/schemas/MoveAfterBlockOperation"
        - $ref: "#/components/schemas/DeleteBlockOperation"
      discriminator:
        propertyName: op
        mapping:
          insert_after: "#/components/schemas/InsertAfterBlockOperation"
          update: "#/components/schemas/UpdateBlockOperation"
          move_after: "#/components/schemas/MoveAfterBlockOperation"
          delete: "#/components/schemas/DeleteBlockOperation"
    DocumentCreateInput:
      type: object
      required: [title]
      properties:
        project_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Optional. Omitting it, or sending null, files the document in the
            project reserved as the default (slug `personal`) rather than
            leaving it belonging to nothing -- most notes are not written with
            a project in mind, and a document filed nowhere is one nothing
            lists. Sending one still wins.


            `422 default_project_missing` when that project does not exist,
            which means the reserved slug has been renamed or
            `mix rinto.actors.setup_human` was never run.
        title:
          type: string
          minLength: 1
          description: >-
            The only source of the document title. It is never read out of the body,
            so an H1 in the body is ordinary content and a body may carry several.
        change_summary:
          type: string
          nullable: true
        actor_id:
          type: string
          format: uuid
          description: >-
            Who the body is credited to. Required whenever `markdown` produces at
            least one block; every block of a new document is credited to this actor.
        markdown:
          type: string
          description: >-
            The document body as one Markdown document. The server cuts it into
            blocks at every top-level H1, H2 and H3 heading; H4 and deeper stay with
            their section, and headings inside code blocks, lists or block quotes do
            not cut. Blocks are stored as Markdown re-rendered from the parsed
            document, so formatting is normalised. Use
            `POST /documents/preview_blocks` to see the split before creating anything.
      additionalProperties: false
    BacklinksResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [total, groups]
          properties:
            total:
              type: integer
              description: References found, across all groups.
            groups:
              type: array
              description: >
                Grouped by the kind of place the text lives, ordered by that
                kind. A backlink panel reads as sections; a client that wanted a
                flat list can concatenate, while one that wanted sections out of
                a flat list would have to group it back itself.
              items:
                $ref: "#/components/schemas/BacklinkGroup"
    BacklinkGroup:
      type: object
      required: [source_type, count, entries]
      properties:
        source_type:
          type: string
          enum: [document_block, annotation, annotation_reply, task, message]
          description: The kind of place the referring text lives.
        count:
          type: integer
        entries:
          type: array
          items:
            $ref: "#/components/schemas/Backlink"
    Backlink:
      type: object
      required: [source_type, source_id, label, position, archived]
      properties:
        source_type:
          type: string
        source_id:
          type: string
          format: uuid
          description: >
            The referring thing. For `document_block` this is the block's stable
            `block_id`, not a per-revision row id.
        document_id:
          type: string
          format: uuid
          nullable: true
          description: The document the referring text lives in, where it lives in one.
        document_title:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
          description: >
            What to name the source in a list: the document's title for a block,
            an annotation or a reply; the task's title for a task; the topic's
            title for a message.
        excerpt:
          type: string
          nullable: true
          description: >
            The referring text, truncated. Always absent for a message: a
            transcript quoted out of context reads as a conclusion, which is the
            same reason a conversation is linkable but never expandable.
        label:
          type: string
          description: >
            The link text as written. This is what to show a reader when the
            target itself is gone.
        position:
          type: integer
          description: >
            Where the reference falls in its source's own text. Two references
            from one source to one target are two entries with different
            positions -- they are not deduplicated, because collapsing them would
            lose which mention was which.
        archived:
          type: boolean
          description: >
            Whether the document carrying the source has been archived. Flagged
            rather than filtered: archiving is not deleting, and the reference is
            still real.
    SearchResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
    SearchResult:
      type: object
      required: [uri, type, score, archived]
      properties:
        uri:
          type: string
          description: >
            The canonical address of the result. Paste it into a body, or hand it
            to `POST /references/resolve` or `GET /backlinks` unchanged.
          example: "rinto://block/01936f2a-1c4e-7c3a-9f1b-2d4e6a8b0c1d"
        type:
          type: string
          description: The kind of thing found, matching the `type` asked for.
        title:
          type: string
          nullable: true
          description: The result's name. For a block, its heading; for an annotation, its document's title.
        excerpt:
          type: string
          nullable: true
          description: The text that matched, truncated. Enough to see why it was returned.
        document_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The document a block or annotation belongs to. Present so that
            following a hit does not need a second call, the same second level
            the reference resolver and backlinks hand back.
        document_title:
          type: string
          nullable: true
        score:
          type: number
          format: float
          description: >
            The reranker's score, higher being better. Not a cosine distance, and
            on the model's own scale -- useful for ordering within one response,
            not as a threshold across queries.
        archived:
          type: boolean
          description: Whether the result, or the document carrying it, has been archived.
    ResolveReferencesInput:
      type: object
      required: [uris]
      properties:
        uris:
          type: array
          description: >
            The `rinto://` URIs to resolve. Anything that is not one still gets a
            result, with `state: invalid` -- one mistyped reference in a long body
            must not take the other links down with it.
          items:
            type: string
            example: "rinto://task/01936f2a-1c4e-7c3a-9f1b-2d4e6a8b0c1d"
    ResolveReferencesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedReference"
    ResolvedReference:
      type: object
      required: [uri, type, state, archived]
      properties:
        uri:
          type: string
          description: The URI asked about, echoed back so results need no positional bookkeeping.
        type:
          type: string
          nullable: true
          description: >
            The addressed type, or `null` when the URI did not parse. One of
            `project`, `document`, `block`, `annotation`, `proposal`, `task`,
            `conversation`, `attachment` -- or a type this build does not know,
            which is reported rather than refused.
          example: task
        state:
          type: string
          enum: [ok, broken, unknown_type, invalid]
          description: >
            `ok` -- resolved and present.


            `broken` -- a known type, correctly addressed, that is not there any
            more. Render the link degraded. This is the only state that should say
            something was deleted.


            `unknown_type` -- well-formed, naming a type this build has no notion
            of. Render as plain text and say nothing: the address may well be good,
            and text mentioning a kind of thing that does not exist yet still saves.


            `invalid` -- not a well-formed `rinto://` URI at all. Render as plain
            text; the address was never good, which is a different thing to fix.
        title:
          type: string
          nullable: true
          description: The target's name. For a block, its heading.
        subtitle:
          type: string
          nullable: true
          description: >
            A one-line qualifier for a preview -- a status, a document title, a
            mime type. Absent for a conversation, which gives up only its title.
        excerpt:
          type: string
          nullable: true
          description: >
            The opening of the target's body, truncated. Enough to tell two similar
            things apart in a hover card, never a substitute for opening the thing.
            Always absent for a conversation: a topic is a transcript, and half of
            one shown as a preview reads as a conclusion.
        document_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The document a block, annotation, or proposal sits in. Present because
            following one of those means opening that document -- a fact about the
            resources, not a route -- and a client should not need a second call to
            learn which document it is.
        document_title:
          type: string
          nullable: true
          description: The title of that document.
        archived:
          type: boolean
          description: >
            Whether the target, or the document carrying it, has been archived.
            Archiving is not deleting: the body is still there, so this stays
            `state: ok`. Render it muted rather than broken.
    DocumentPreviewBlocksInput:
      type: object
      required: [markdown]
      properties:
        markdown:
          type: string
      additionalProperties: false
    DocumentPreviewBlocksResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [blocks]
          properties:
            blocks:
              type: array
              items:
                type: object
                required: [position, content]
                properties:
                  position:
                    type: integer
                    minimum: 0
                  content:
                    type: string
              additionalProperties: false
          additionalProperties: false
      additionalProperties: false
    DocumentRevisionCreateInput:
      type: object
      required: [base_revision_id]
      properties:
        base_revision_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          description: Omission inherits the parent revision title.
        change_summary:
          type: string
          nullable: true
        block_ops:
          type: array
          default: []
          description: Operations are applied sequentially to the parent block snapshot.
          items:
            $ref: "#/components/schemas/DocumentBlockOperation"
      additionalProperties: false
    DocumentBlock:
      type: object
      required: [block_id, actor_id, content, position]
      properties:
        block_id:
          type: string
          format: uuid
          description: Stable logical block identifier across revisions.
        actor_id:
          type: string
          format: uuid
          description: Actor responsible for this block content.
        content:
          type: string
        position:
          type: integer
          minimum: 0
      additionalProperties: false
    DocumentRevisionSummary:
      type: object
      required:
        [id, document_id, parent_id, title, change_summary, source_conversation_id, inserted_at]
      properties:
        id:
          type: string
          format: uuid
          description: Time-sortable UUIDv7 identifier.
        document_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        change_summary:
          type: string
          nullable: true
        source_conversation_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Which discussion produced this revision. Makes "what did that
            discussion change?" a query rather than a stored entity.
        inserted_at:
          type: string
          format: date-time
      additionalProperties: false
    DocumentRevision:
      type: object
      required: [id, document_id, parent_id, title, change_summary, inserted_at, blocks]
      properties:
        id:
          type: string
          format: uuid
          description: Time-sortable UUIDv7 identifier.
        document_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        change_summary:
          type: string
          nullable: true
        inserted_at:
          type: string
          format: date-time
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/DocumentBlock"
      additionalProperties: false
    DocumentSummary:
      type: object
      required: [id, project_id, archived_at, status, latest_revision, inserted_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [draft, formal, applied]
          description: >-
            How far along the document is, and therefore whether anything
            downstream may still consume it. `draft` is where every document
            starts and means nobody has vouched for it. `formal` is set for good
            by `POST /documents/{document_id}/formalize` and is a finished state,
            not a waiting room -- most documents stop here. `applied` means the
            document has already been consumed downstream, and once is all there
            is. Every step is one-way.
        latest_revision:
          $ref: "#/components/schemas/DocumentRevisionSummary"
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    Document:
      type: object
      required: [id, project_id, archived_at, status, latest_revision, inserted_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        archived_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: [draft, formal, applied]
          description: >-
            How far along the document is, and therefore whether anything
            downstream may still consume it. `draft` is where every document
            starts and means nobody has vouched for it. `formal` is set for good
            by `POST /documents/{document_id}/formalize` and is a finished state,
            not a waiting room -- most documents stop here. `applied` means the
            document has already been consumed downstream, and once is all there
            is. Every step is one-way.
        latest_revision:
          $ref: "#/components/schemas/DocumentRevision"
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    DocumentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Document"
      additionalProperties: false
    DocumentListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSummary"
      additionalProperties: false
    DocumentRevisionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/DocumentRevision"
      additionalProperties: false
    DocumentRevisionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/DocumentRevisionSummary"
      additionalProperties: false
    ProjectRepo:
      type: object
      required: [id, project_id, name, git_url, branch]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier.
        project_id:
          type: string
          format: uuid
        name:
          type: string
          description: >
            How people and the CLI name this repository within its project;
            unique there, and editable. Has to start with a letter or digit and
            hold only letters, digits, `.`, `_` and `-`. Not where the working
            copy lives -- that is addressed by id, so renaming costs nothing.
        git_url:
          type: string
          format: uri
        branch:
          type: string
        credential_id:
          type: string
          format: uuid
          nullable: true
        last_synced_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        last_sync_error:
          type: string
          nullable: true
          readOnly: true
        inserted_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    ProjectRepoCheckout:
      type: object
      required: [path, branch, commit]
      properties:
        path:
          type: string
          description: >
            Absolute path on the server. Meaningful only to something running on
            that machine, which is what this endpoint is for.
        branch:
          type: string
        commit:
          type: string
          description: >
            The commit the working copy is at. What makes a statement about this
            code attributable to a version of it.
        synced_at:
          type: string
          format: date-time
          nullable: true
          description: When the mirror was last known to match the remote.
        sync_error:
          type: string
          nullable: true
          description: >
            Present when this copy was served but could not be refreshed. The
            path is real; the code in it is older than the remote.
      additionalProperties: false
    ProjectRepoCheckoutResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ProjectRepoCheckout"
      additionalProperties: false
    ProjectRepoCreateInput:
      type: object
      required: [name, git_url, branch]
      properties:
        name:
          type: string
        git_url:
          type: string
          format: uri
          description: Must use HTTPS when credential_id is set.
        branch:
          type: string
        credential_id:
          type: string
          format: uuid
          nullable: true
      additionalProperties: false
    ProjectRepoUpdateInput:
      type: object
      properties:
        name:
          type: string
        git_url:
          type: string
          format: uri
          description: Must use HTTPS when credential_id is set.
        branch:
          type: string
        credential_id:
          type: string
          format: uuid
          nullable: true
      additionalProperties: false
    ProjectRepoResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ProjectRepo"
      additionalProperties: false
    ProjectRepoListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProjectRepo"
      additionalProperties: false
    TaskKind:
      type: string
      enum: [work, summary]
      description: >
        `work` is a job someone does. `summary` is a cover over jobs: it takes
        no assignee, accepts no events, and its `status` is the rollup over its
        children. Never settable, but it moves both ways:
        `POST /tasks/{id}/split` turns a job into a cover, and emptying a cover
        of its last child -- by deleting that child or by moving it elsewhere
        -- turns it back into a job automatically. It is not a status value,
        because a summary node's status is the most informative thing on it and
        needs the slot.
    TaskStatus:
      type: string
      enum: [open, in_progress, done, cancelled]
      description: >
        `open` -> `in_progress` (start) -> `done` (complete), with `cancel`
        from either live status and `reopen` from `done` or `cancelled` back to
        `open`. Assignment is not a status: a task with an owner that nobody
        has started is still `open`. On a summary node this is derived: all
        children untouched is `open`, all finished is `done` (a mix of done and
        cancelled counts as done -- the chunk landed), all dropped is
        `cancelled`, anything else is `in_progress`, and an empty cover is
        `open`.
    Task:
      type: object
      required: [id, project_id, kind, title, status]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier.
        project_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Position in the WBS. Null is a root. A parent must be a summary
            node in the same project.
        kind:
          $ref: "#/components/schemas/TaskKind"
        document_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The document this task implements against. A pointer, not
            ownership -- deleting the document leaves the task standing.
        assignee_id:
          type: string
          format: uuid
          nullable: true
          description: >
            Whose it is. Written by both `assign` and `claim`, so nothing
            downstream has to know which happened.
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/TaskStatus"
        due_on:
          type: string
          format: date
          nullable: true
        estimate:
          allOf:
            - $ref: "#/components/schemas/TaskEstimate"
          nullable: true
          readOnly: true
          description: >
            Written through `estimate` on create/update as an object of
            `optimistic` / `likely` / `pessimistic`; `expected` is derived and
            never sent. On a summary node this is the sum over its estimated
            descendants, or null when none of them carry one -- zero would be a
            claim that the chunk is free.
        unestimated_tasks:
          type: integer
          minimum: 0
          nullable: true
          readOnly: true
          description: >
            How many work descendants under a cover carry no estimate. A count
            of tasks, not minutes -- everything else nearby is minutes, which
            is why the name says so. Null on a `work` row, where the estimate
            itself answers the question. A summed estimate that quietly skipped
            half the tree reads exactly like a complete one; this is what tells
            them apart.
        difficulty:
          type: integer
          nullable: true
          enum: [1, 2, 3, 5, 8, 13, 21]
          description: >
            Fibonacci story point. A rating of the work, not a duration --
            duration is `estimate`, and this is the knob later estimates are
            calibrated against. Null until rated. A summary node stores none
            and reports none: difficulty does not sum.
        unrated_tasks:
          type: integer
          minimum: 0
          nullable: true
          readOnly: true
          description: >
            How many work descendants under a cover carry no difficulty. Null
            on a `work` row. Same honesty rule as `unestimated_tasks`.
        actual_minutes:
          type: integer
          minimum: 0
          nullable: true
          description: >
            How long the work actually took, in minutes. Recorded rather than
            derived from `started_at` / `completed_at`, which is wall time and
            counts the night. Cleared on reopen. On a summary node this is the
            sum over its measured descendants, or null when none of them carry
            one.
        unmeasured_tasks:
          type: integer
          minimum: 0
          nullable: true
          readOnly: true
          description: >
            How many work descendants under a cover carry no `actual_minutes`.
            Null on a `work` row.
        planned_start_on:
          type: string
          format: date
          nullable: true
          description: >
            The earliest day this task may be worked, and at the same time the
            whole of "put it in that iteration": set it to a day in some week
            and the task is selected into that week. **Null is the backlog** --
            never a candidate for any week, which is how work nobody intends to
            do is kept out without a mechanism of its own.

            It is not where the task lands. That is `GET /schedule`'s answer,
            because it depends on every other task competing for the same
            minutes. A task can land later than this day, and can spill across
            days, when the day it was selected for was already partly full.

            A summary node holds none; on one this reports the earliest day
            underneath it. There is deliberately no matching end -- see
            `/schedule`.
        first_planned_on:
          type: string
          format: date
          nullable: true
          readOnly: true
          description: >
            The day this task was **first** selected into any week. Written
            once, the first time `planned_start_on` goes from null to a day,
            and never moved again -- returning the task to the backlog and
            planning it afresh does not reset it.


            It exists so that slip survives replanning. `planned_start_on` is
            the current plan and moving it is the ordinary way to reschedule,
            so slip measured against it is zero for every task however many
            times the task was pushed. `GET /history` reports `slip_weeks`
            against this column.


            Not writable. On a summary node it is the earliest one underneath,
            like `planned_start_on`; a cover stores neither.
        unscheduled_tasks:
          type: integer
          minimum: 0
          nullable: true
          readOnly: true
          description: >
            How many work descendants under a cover are still in the backlog.
            Null on a `work` row. Same honesty rule as `unestimated_tasks`: a
            chunk reporting "starts in week 12" while half of it is unplanned
            reads like a schedule while being a fragment of one.
        priority:
          type: integer
          enum: [1, 2, 3, 4, 5]
          default: 3
          description: >
            1 is highest, 3 is normal, and never null -- "no opinion" *is*
            "normal", so unlike an estimate a missing priority carries nothing
            worth counting.

            It decides who gets cut when a week is over-filled, and sorts ahead
            of everything else including how long a task has been waiting: work
            carried over from last week has no claim to jump the queue. It
            never decides that work happens before its own prerequisite.
        assigned_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: >
            When the current assignee got it. Restamped on reassignment, and
            cleared on release.
        started_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        completed_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
        inserted_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    TaskCreateInput:
      type: object
      required: [title]
      properties:
        kind:
          $ref: "#/components/schemas/TaskKind"
        parent_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        document_id:
          type: string
          format: uuid
          nullable: true
        assignee_id:
          type: string
          format: uuid
          nullable: true
        due_on:
          type: string
          format: date
          nullable: true
        estimate:
          allOf:
            - $ref: "#/components/schemas/TaskEstimateInput"
          nullable: true
          description: >
            Send all three points or null to clear. The flat
            `estimate_optimistic` / `estimate_likely` / `estimate_pessimistic`
            columns are never writable -- setting one alone would slip past
            every rule about the shape being whole and ordered.
        difficulty:
          type: integer
          nullable: true
          enum: [1, 2, 3, 5, 8, 13, 21]
          description: >
            Fibonacci story point, or null to clear. Refused on a summary node
            (`invalid_difficulty`).
        actual_minutes:
          type: integer
          minimum: 0
          nullable: true
          description: >
            Recorded duration in minutes, or null to clear. Refused on a
            summary node (`invalid_actual`). Completing a task can set this in
            the same act; PATCH is how it is filled in afterwards.
        planned_start_on:
          type: string
          format: date
          nullable: true
          description: >
            Selects the task into the week this day falls in, and bounds where
            inside that week it may land. Null is the backlog. Refused on a
            summary node.
        priority:
          type: integer
          enum: [1, 2, 3, 4, 5]
          description: >
            1 highest, defaults to 3. Decides who is cut when a week is
            over-filled.
      additionalProperties: false
    TaskUpdateInput:
      type: object
      description: >
        `status` and `kind` are absent on purpose. Use the event endpoints for
        status and `POST /tasks/{id}/split` for `kind`; neither belongs in the
        same request as an edit of the wording. Moving `parent_id` away from a
        cover's last child demotes that cover to `work` as a side effect, so
        re-read the WBS after a structural move.


        `additionalProperties: false` binds the caller, not the server: a key
        that is not listed here is ignored rather than refused, so a body
        carrying `status` is answered `200` and changes nothing. Read the
        returned task rather than the status code.
      properties:
        parent_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        document_id:
          type: string
          format: uuid
          nullable: true
        assignee_id:
          type: string
          format: uuid
          nullable: true
        due_on:
          type: string
          format: date
          nullable: true
        estimate:
          allOf:
            - $ref: "#/components/schemas/TaskEstimateInput"
          nullable: true
          description: >
            Send all three points or null to clear. The flat
            `estimate_optimistic` / `estimate_likely` / `estimate_pessimistic`
            columns are never writable -- setting one alone would slip past
            every rule about the shape being whole and ordered.
        difficulty:
          type: integer
          nullable: true
          enum: [1, 2, 3, 5, 8, 13, 21]
          description: >
            Fibonacci story point, or null to clear. Refused on a summary node
            (`invalid_difficulty`).
        actual_minutes:
          type: integer
          minimum: 0
          nullable: true
          description: >
            Recorded duration in minutes, or null to clear. Refused on a
            summary node (`invalid_actual`).
        planned_start_on:
          type: string
          format: date
          nullable: true
          description: >
            Moves the task into the week this day falls in; null returns it to
            the backlog.

            Refused with `dependency_out_of_order` when the move would put the
            task ahead of live work it waits for, or would push a prerequisite
            past something waiting on it. Both ends of every edge the task sits
            on are checked, and only when the day actually changes -- editing a
            title never fails over a scheduling conflict.
        priority:
          type: integer
          enum: [1, 2, 3, 4, 5]
          description: 1 highest, 3 normal.
      additionalProperties: false
    TaskCompleteInput:
      type: object
      properties:
        actual_minutes:
          type: integer
          minimum: 0
          description: >
            How long the work took, in minutes. Absent or null leaves whatever
            was already stored.
      additionalProperties: false
    Job:
      type: object
      required: [id, worker, status, error, inserted_at]
      properties:
        id:
          type: integer
          description: The handle a `202` hands back. Keep it across reconnects.
        worker:
          type: string
          description: Which kind of work this is, e.g. `RintoPMO.Tasks.EstimationWorker`.
        status:
          type: string
          enum: [running, succeeded, failed]
          description: >
            The queue's eight states collapsed into the only question a client
            asks: keep waiting, or stop.
        error:
          type: string
          nullable: true
          description: >
            What the last attempt said, as the queue wrote it down -- formatted
            for a person reading a log, not for a UI. A client that was
            connected already got the sentence over the socket; this is the
            copy left for one that was not.
        inserted_at:
          type: string
          format: date-time
      additionalProperties: false
    TaskEstimationInput:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [difficulty, time]
          description: >
            Which question to put to the model. Required -- there is no default.
      additionalProperties: false
    JobResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Job"
      additionalProperties: false
    TaskActorInput:
      type: object
      required: [actor_id]
      properties:
        actor_id:
          type: string
          format: uuid
      additionalProperties: false
    TaskEstimate:
      type: object
      required: [optimistic, likely, pessimistic, expected]
      description: >
        Three-point estimate, in minutes. Minutes because a breakdown sums and
        integers sum exactly; any coarser unit would force a decision about how
        long a working day is that this API has no business making.
      properties:
        optimistic:
          type: integer
          minimum: 0
        likely:
          type: integer
          minimum: 0
        pessimistic:
          type: integer
          minimum: 0
        expected:
          type: integer
          minimum: 0
          readOnly: true
          description: PERT weighting, `(optimistic + 4 * likely + pessimistic) / 6`, rounded.
      additionalProperties: false
    TaskEstimateInput:
      type: object
      required: [optimistic, likely, pessimistic]
      description: >
        All three or none. A half-given three-point estimate has no expected
        value, so it is not a smaller estimate but a broken one. Must satisfy
        `optimistic <= likely <= pessimistic`.
      properties:
        optimistic:
          type: integer
          minimum: 0
        likely:
          type: integer
          minimum: 0
        pessimistic:
          type: integer
          minimum: 0
      additionalProperties: false
    TaskSplitInput:
      type: object
      properties:
        children:
          type: array
          description: >
            Jobs to file under the new cover. Each is created as `kind: work`
            with its `parent_id` set; a child that should itself be a cover is
            split in turn.
          items:
            $ref: "#/components/schemas/TaskSplitChildInput"
      additionalProperties: false
    TaskSplitChildInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        document_id:
          type: string
          format: uuid
          nullable: true
        assignee_id:
          type: string
          format: uuid
          nullable: true
        due_on:
          type: string
          format: date
          nullable: true
        estimate:
          allOf:
            - $ref: "#/components/schemas/TaskEstimateInput"
          nullable: true
          description: >
            Send all three points or null to clear. The flat
            `estimate_optimistic` / `estimate_likely` / `estimate_pessimistic`
            columns are never writable -- setting one alone would slip past
            every rule about the shape being whole and ordered.
        difficulty:
          type: integer
          nullable: true
          enum: [1, 2, 3, 5, 8, 13, 21]
        actual_minutes:
          type: integer
          minimum: 0
          nullable: true
        planned_start_on:
          type: string
          format: date
          nullable: true
          description: >
            Selects the child into the week this day falls in. Null is the
            backlog. A breakdown that already knows when its parts are worked
            can say so here rather than PATCHing each child afterwards.
        priority:
          type: integer
          enum: [1, 2, 3, 4, 5]
          description: 1 highest, 3 normal. Inherits nothing from the cover.
      additionalProperties: false
    TaskSplitResponse:
      type: object
      required: [data, children]
      properties:
        data:
          $ref: "#/components/schemas/Task"
        children:
          type: array
          items:
            $ref: "#/components/schemas/Task"
      additionalProperties: false
    TaskDependenciesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [depends_on, dependents]
          properties:
            depends_on:
              type: array
              description: What this task waits for.
              items:
                $ref: "#/components/schemas/Task"
            dependents:
              type: array
              description: What waits for this task.
              items:
                $ref: "#/components/schemas/Task"
          additionalProperties: false
      additionalProperties: false
    ScheduleResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleWeek"
      additionalProperties: false
    TaskEdgeListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TaskEdge"
      additionalProperties: false
    TaskEdge:
      type: object
      required: [task_id, depends_on_id]
      description: >
        "`task_id` cannot start until `depends_on_id` is done." An arrow, in
        the direction the work waits.
      properties:
        task_id:
          type: string
          format: uuid
        depends_on_id:
          type: string
          format: uuid
      additionalProperties: false
    CalibrationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [weeks, difficulty]
          properties:
            weeks:
              type: array
              items:
                $ref: "#/components/schemas/CalibrationWeek"
            difficulty:
              type: array
              items:
                $ref: "#/components/schemas/CalibrationRung"
          additionalProperties: false
      additionalProperties: false
    CalibrationWeek:
      type: object
      required:
        [
          week,
          completed,
          comparable,
          expected_minutes,
          actual_minutes,
          unestimated,
          unmeasured,
        ]
      properties:
        week:
          type: string
          format: date
          description: The Monday of the week the work was finished in.
        completed:
          type: integer
          minimum: 0
          description: Work items delivered in this week.
        comparable:
          type: integer
          minimum: 0
          description: >
            How many of them carry both an estimate and a recorded duration --
            the population the two sums below are taken over. Read the sums
            against this number, never against `completed`.
        expected_minutes:
          type: integer
          minimum: 0
          description: PERT expected values, summed over the comparable tasks. Zero when there are none.
        actual_minutes:
          type: integer
          minimum: 0
          description: Recorded durations, summed over the same tasks.
        unestimated:
          type: integer
          minimum: 0
          description: Delivered work that carried no estimate.
        unmeasured:
          type: integer
          minimum: 0
          description: Delivered work whose duration nobody recorded.
      additionalProperties: false
    CalibrationRung:
      type: object
      required: [difficulty, tasks, measured, median_actual_minutes]
      properties:
        difficulty:
          type: integer
          enum: [1, 2, 3, 5, 8, 13, 21]
        tasks:
          type: integer
          minimum: 0
          description: Delivered work rated with this story point in the window.
        measured:
          type: integer
          minimum: 0
          description: How many of them had a duration recorded.
        median_actual_minutes:
          type: integer
          minimum: 0
          nullable: true
          description: >
            The middle recorded duration at this rung, or null when nothing at
            it was ever measured -- which is not the same as a rung that is
            genuinely quick.


            The middle value rather than the average: with a handful of tasks
            per rung, one that ran three days moves a mean somewhere no task
            ever was, and the result reads as knowledge.
      additionalProperties: false
    HistoryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/HistoryRecord"
      additionalProperties: false
    HistoryRecord:
      type: object
      required:
        [
          task,
          started_on,
          completed_on,
          planned_on,
          first_planned_on,
          slip_weeks,
          expected_minutes,
          actual_minutes,
        ]
      description: >
        One task's work as the clocks recorded it, with the plan beside it.
        Every field is measured or derived from something measured; nothing
        here is filled in.
      properties:
        task:
          $ref: "#/components/schemas/Task"
        started_on:
          type: string
          format: date
          description: The day work began. Always present -- nothing without a start is here.
        completed_on:
          type: string
          format: date
          nullable: true
          description: Null while the work is still in flight.
        planned_on:
          type: string
          format: date
          nullable: true
          description: The task's current `planned_start_on`, whatever it has been moved to.
        first_planned_on:
          type: string
          format: date
          nullable: true
          description: The day it was first selected into any week. What `slip_weeks` counts from.
        slip_weeks:
          type: integer
          nullable: true
          description: >
            Whole weeks between the week the task was first planned for and the
            week it actually began. Positive is late, negative is early, zero
            means it began in the week it was promised for -- a week is the
            unit the plan is made in, so starting Wednesday on what was
            selected for Monday is not a slip.


            **Null is not zero.** It means the task was never selected into any
            week at all, so there was no promise to slip against.
        expected_minutes:
          type: integer
          minimum: 0
          nullable: true
          description: >
            PERT expected value of the three-point estimate, or null when the
            task carries no estimate. Not filled in -- a zero here would read
            as a measurement.
        actual_minutes:
          type: integer
          minimum: 0
          nullable: true
          description: >
            What was recorded on completion, or null when nobody recorded it.
            Null against a non-null `expected_minutes` is the gap that says how
            much of a velocity figure to believe.
      additionalProperties: false
    ScheduleWeek:
      type: object
      required: [week, capacity, calendar_known, allocated, days, overflow, blocked]
      properties:
        week:
          type: string
          format: date
          description: The Monday the week starts on. This is the whole of an iteration's identity.
        capacity:
          type: integer
          minimum: 0
          description: >
            Minutes this week had to give. In the current week the days already
            behind us are not counted, so this is smaller than a full week --
            compare `allocated` against this rather than against 5 x 480.
        calendar_known:
          type: boolean
          description: >
            False when this week sits in a year whose holidays were never
            fetched. The week is still planned -- refusing to answer helps
            nobody -- but Monday-to-Friday is all that is behind `capacity`,
            which in China plans Spring Festival as five ordinary working days.
            Showing the number without showing this presents a guess as a fact.
        allocated:
          type: integer
          minimum: 0
          description: Sum of every slice in `days`.
        days:
          type: array
          description: >
            One entry per day that received work, earliest first. A day is a
            shared 480-minute bar, not a per-task lane: a task that does not fit
            in what is left of a day continues into the next one, and appears
            under each with its own share. The shares sum to its estimate,
            never more.
          items:
            $ref: "#/components/schemas/ScheduleDay"
        overflow:
          type: array
          description: >
            Selected into this week and did not fit, in priority order, so the
            first entry came closest. These have **no landing day** -- they are
            reported rather than pushed into a week nobody selected them for.
            This is the answer to "is this week's plan realistic", and it names
            the tasks where a percentage could not.
          items:
            $ref: "#/components/schemas/Task"
        blocked:
          type: array
          description: >
            Not filled because something they wait for was not. Kept apart from
            `overflow` because they are two facts with two different answers:
            overflow means the week is too full and the work to cut is here,
            blocked means the problem is upstream. Merging them would send a
            reader to cut work that was never the problem.

            Most conflicts never reach here -- scheduling a task ahead of a live
            prerequisite is refused at the write. What cannot be refused is
            capacity, so a prerequisite that overflows takes its dependents with
            it, transitively.
          items:
            $ref: "#/components/schemas/Task"
      additionalProperties: false
    ScheduleDay:
      type: object
      required: [day, allocated, capacity, tasks]
      properties:
        day:
          type: string
          format: date
        allocated:
          type: integer
          minimum: 0
        capacity:
          type: integer
          minimum: 0
          description: Always one working day's minutes.
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleAllocation"
      additionalProperties: false
    ScheduleAllocation:
      type: object
      required: [minutes, task]
      properties:
        minutes:
          type: integer
          minimum: 0
          description: This task's share of this day, not its whole estimate.
        task:
          $ref: "#/components/schemas/Task"
      additionalProperties: false
    CalendarDay:
      type: object
      required: [day, kind]
      properties:
        day:
          type: string
          format: date
        kind:
          type: string
          enum: [holiday, workday, leave]
          description: >
            `holiday` is a statutory day off on a day the weekend rule would
            have worked. `workday` is the Saturday or Sunday worked to make up
            for one -- the same field in the same source produces both, which is
            why they share a table. `leave` is the person being away, and is the
            only one a client writes.
        name:
          type: string
          nullable: true
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    CalendarImport:
      type: object
      required: [year, source]
      properties:
        year:
          type: integer
        source:
          type: string
          description: Where the year was read from, so numbers that look wrong can be traced.
        updated_at:
          type: string
          format: date-time
          description: When the year was last read.
      additionalProperties: false
    CalendarDaysResponse:
      type: object
      required: [data, imports]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CalendarDay"
        imports:
          type: array
          description: The years actually behind `data`. See the endpoint description.
          items:
            $ref: "#/components/schemas/CalendarImport"
      additionalProperties: false
    CalendarDayResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CalendarDay"
      additionalProperties: false
    TaskStatusCounts:
      type: object
      required: [open, in_progress, done, cancelled]
      description: Every status is present, including the ones at zero.
      properties:
        open:
          type: integer
          minimum: 0
        in_progress:
          type: integer
          minimum: 0
        done:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0
      additionalProperties: false
    TaskAssigneeStats:
      type: object
      required: [actor_id, counts]
      properties:
        actor_id:
          type: string
          format: uuid
        counts:
          $ref: "#/components/schemas/TaskStatusCounts"
      additionalProperties: false
    TaskStats:
      type: object
      required: [total, unassigned, overdue, by_status, by_assignee, actual]
      properties:
        total:
          type: integer
          minimum: 0
          description: Work items only. Summary nodes are never counted.
        unassigned:
          type: integer
          minimum: 0
          description: The claimable pool, counted across every status.
        overdue:
          type: integer
          minimum: 0
          description: Outstanding tasks past `due_on`. Finished work is never overdue.
        by_status:
          $ref: "#/components/schemas/TaskStatusCounts"
        by_assignee:
          type: array
          description: >
            Only actors holding at least one task, sorted by `actor_id`.
            Unassigned work is its own number, not an actor with a null id.
          items:
            $ref: "#/components/schemas/TaskAssigneeStats"
        estimate:
          $ref: "#/components/schemas/TaskEstimateStats"
        actual:
          $ref: "#/components/schemas/TaskActualStats"
      additionalProperties: false
    TaskEstimateStats:
      type: object
      required: [total, remaining, unestimated_tasks, unestimated_tasks_remaining]
      properties:
        total:
          allOf:
            - $ref: "#/components/schemas/TaskEstimate"
          nullable: true
          description: >
            What the project was ever thought to be worth. Null when nothing
            was estimated -- zero would say the project is free.
        remaining:
          allOf:
            - $ref: "#/components/schemas/TaskEstimate"
          nullable: true
          description: The same over `open` and `in_progress` work only.
        unestimated_tasks:
          type: integer
          minimum: 0
          description: >
            How many work items carry no estimate -- a count of tasks, not
            minutes. Always read it next to `total`: a sum over half the
            backlog renders identically to a sum over all of it. It is also the
            only number left when `total` is null.
        unestimated_tasks_remaining:
          type: integer
          minimum: 0
      additionalProperties: false
    TaskActualStats:
      type: object
      required: [total, unmeasured_tasks]
      properties:
        total:
          type: integer
          minimum: 0
          nullable: true
          description: >
            Sum of recorded `actual_minutes` on work items. Null when nothing
            has been measured -- zero would say the project took no time.
        unmeasured_tasks:
          type: integer
          minimum: 0
          description: >
            How many work items carry no `actual_minutes`. A count of tasks,
            not minutes.
      additionalProperties: false
    TaskStatsResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/TaskStats"
      additionalProperties: false
    TaskResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Task"
      additionalProperties: false
    TaskListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Task"
      additionalProperties: false
    TaskSchemaResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [create, update, split]
          description: >
            One JSON Schema (2020-12) per write shape, keyed by the write it
            describes. The bodies themselves are the `TaskCreateInput`,
            `TaskUpdateInput` and `TaskSplitInput` components; what is served
            here is those shapes rendered as schema documents, with a worked
            example attached to each.
          properties:
            create:
              type: object
              description: The shape of `POST /projects/{project_slug}/tasks`.
            update:
              type: object
              description: The shape of `PATCH /tasks/{id}`.
            split:
              type: object
              description: The shape of `POST /tasks/{id}/split`.
          additionalProperties: false
      additionalProperties: false
    RepoCredential:
      type: object
      required: [id, name, username]
      description: The token is never returned.
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 identifier.
        name:
          type: string
        username:
          type: string
        inserted_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    RepoCredentialCreateInput:
      type: object
      required: [name, username, token]
      properties:
        name:
          type: string
        username:
          type: string
        token:
          type: string
          format: password
          writeOnly: true
      additionalProperties: false
    RepoCredentialUpdateInput:
      type: object
      description: An omitted token retains the existing token.
      properties:
        name:
          type: string
        username:
          type: string
        token:
          type: string
          format: password
          writeOnly: true
      additionalProperties: false
    RepoCredentialResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/RepoCredential"
      additionalProperties: false
    RepoCredentialListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RepoCredential"
      additionalProperties: false
    AnnotationSummary:
      type: object
      required:
        [
          id,
          document_id,
          actor_id,
          block_id,
          block_text,
          selected_text,
          content,
          confirmed_at,
          confirmed_by_revision_id,
          inserted_at,
          updated_at
        ]
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        block_id:
          type: string
          format: uuid
          nullable: true
        block_text:
          type: string
          nullable: true
          description: Optional snapshot of the block body when the annotation was created.
        selected_text:
          type: string
          nullable: true
          description: Selected text snapshot without positional offsets.
        content:
          type: string
          description: Opening opinion for the annotation thread.
        confirmed_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When a person marked this thread as over. Null is unconfirmed, and
            that is the whole of it -- there is no third value and nothing
            derived. Only the confirm and unconfirm actions move it; being
            discussed never does, and it is ignored on create and update.
        confirmed_by_revision_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The revision that settled this, when the confirmation came with a
            change to the document. Absent alongside a set `confirmed_at` means
            somebody looked and decided no change was needed.
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    AnnotationConfirmInput:
      type: object
      properties:
        confirmed_by_revision_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The revision that settled this, when there was one. Omit when the
            answer was that no change was needed -- that is a confirmation too,
            and its absence is what says which of the two happened.
      additionalProperties: false
    Annotation:
      allOf:
        - $ref: "#/components/schemas/AnnotationSummary"
        - type: object
          required: [replies]
          properties:
            replies:
              type: array
              items:
                $ref: "#/components/schemas/AnnotationReply"
          additionalProperties: false
    AnnotationCreateInput:
      type: object
      required: [actor_id, content]
      properties:
        actor_id:
          type: string
          format: uuid
        block_id:
          type: string
          format: uuid
          nullable: true
        block_text:
          type: string
          nullable: true
        selected_text:
          type: string
          nullable: true
        content:
          type: string
          minLength: 1
      additionalProperties: false
    AnnotationUpdateInput:
      type: object
      properties:
        block_id:
          type: string
          format: uuid
          nullable: true
        block_text:
          type: string
          nullable: true
        selected_text:
          type: string
          nullable: true
        content:
          type: string
          minLength: 1
      additionalProperties: false
    BlockProposal:
      type: object
      required:
        [
          id,
          document_id,
          block_id,
          conversation_id,
          actor_id,
          content,
          base_revision_id,
          status,
          decided_by_actor_id,
          decided_at,
          inserted_at,
          updated_at
        ]
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        block_id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The topic that made it. A proposal's identity is (block,
            conversation); this is nullable only so that losing a topic does
            not take the proposal with it.
        actor_id:
          type: string
          format: uuid
          description: >
            Who wrote the proposed text. The committed block is attributed to
            this actor, not to whoever approved it.
        content:
          type: string
        base_revision_id:
          type: string
          format: uuid
          description: >
            The revision this was written against. Recorded, but not a conflict
            test: a working copy is loaded per document from the latest
            revision, so every topic's base is identical by construction.
        status:
          type: string
          enum: [live, accepted, rejected, superseded]
          description: >
            `live` is standing but uncommitted, `accepted` landed in a
            revision, `rejected` lost a contention. Rows are never deleted.
        decided_by_actor_id:
          type: string
          format: uuid
          nullable: true
        decided_at:
          type: string
          format: date-time
          nullable: true
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    BlockProposalResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/BlockProposal"
      additionalProperties: false
    BlockProposalListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BlockProposal"
      additionalProperties: false
    ProposedResponse:
      type: object
      required: [data, live_proposals, contended]
      properties:
        data:
          $ref: "#/components/schemas/BlockProposal"
        live_proposals:
          type: integer
          minimum: 1
          description: Live proposals now standing on this block.
        contended:
          type: boolean
          description: >
            True once a second topic has proposed on the same block. Returned
            here so a topic learns it before building further on the assumption
            that its version is the one that will land.
      additionalProperties: false
    BlockProposalCreateInput:
      type: object
      required: [block_id, conversation_id, actor_id, content]
      properties:
        block_id:
          type: string
          format: uuid
          description: Must be a block of the document's latest revision.
        conversation_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
      additionalProperties: false
    Contention:
      type: object
      required: [block_id, proposals]
      properties:
        block_id:
          type: string
          format: uuid
        proposals:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/BlockProposal"
      additionalProperties: false
    ContentionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Contention"
      additionalProperties: false
    ConversationBlock:
      type: object
      required: [block_id, position, content, proposal_id, proposed, other_proposals]
      properties:
        block_id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
        content:
          type: string
          description: This topic's proposed text where it has one, otherwise the committed text.
        proposal_id:
          type: string
          format: uuid
          nullable: true
        proposed:
          type: boolean
        other_proposals:
          type: integer
          minimum: 0
          description: >
            How many other topics have proposed on this block. A count, never
            their text.
      additionalProperties: false
    ConversationBlockListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ConversationBlock"
      additionalProperties: false
    CommitInput:
      type: object
      required: [actor_id, base_revision_id]
      properties:
        actor_id:
          type: string
          format: uuid
          description: Who is committing. Recorded on the accepted proposals.
        base_revision_id:
          type: string
          format: uuid
          description: The revision this commit was prepared against; a stale one is a 409.
        block_ids:
          type: array
          description: >
            Which blocks to commit. Omit to take every block holding exactly
            one live proposal.
          items:
            type: string
            format: uuid
        confirm_annotation_ids:
          type: array
          description: >
            Annotations this commit settles. Each is confirmed with
            `confirmed_by_revision_id` pointing at the new revision. One commit
            may touch three annotations and settle two, so these are named
            rather than inferred from what the revision changed.
          items:
            type: string
            format: uuid
        source_conversation_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          minLength: 1
          description: Defaults to the parent revision's title.
        change_summary:
          type: string
          nullable: true
      additionalProperties: false
    Conversation:
      type: object
      required:
        [
          id,
          title,
          title_source,
          actor_id,
          pi_session_id,
          assistant_actor_id,
          hot,
          replay_pending,
          inserted_at,
          updated_at
        ]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          nullable: true
          description: >
            Null until the topic is named. A topic is created unnamed and is
            named automatically from its first user message, in the background,
            so a client may see this fill in shortly after sending -- watch for
            `conversation_updated` on the topic's channel.
        title_source:
          type: string
          enum: [auto, manual]
          nullable: true
          description: >
            Who named the topic. `manual` is a person's words and is never
            overwritten; `auto` is the system's, generated from the first user
            message; `null` means nobody has named it yet and the system still
            may. `title: null` with `title_source: manual` is a topic somebody
            deliberately cleared, and it stays nameless.
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: Who started the topic.
        assistant_actor_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The AI persona this topic is a conversation *with*. Replies are
            attributed to it, and sending a message to a topic that has none is
            refused rather than guessed at. A property of the topic rather than
            of each message: a client that could vary it per message could make
            one topic's history look like two actors talking.
        pi_session_id:
          type: string
          nullable: true
          description: >
            The pi session claimed to be carrying this topic. Non-null is a
            claim, not a guarantee -- see `hot`.
        hot:
          type: boolean
          description: >
            Whether a live pi process is actually carrying the topic. Derived
            rather than stored, because a session can die with nothing left to
            clear the column. Cold is the resting state, not a failure: the
            messages are enough to revive the topic.
        replay_pending:
          type: boolean
          description: >
            A fresh agent process was started and the next message still owes
            it the recent turns. Entirely server-side; exposed only because it
            explains why one reply may take longer than the rest.
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    Decomposition:
      type: object
      required:
        [
          id,
          source_document_id,
          result_document_id,
          status,
          error,
          inserted_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        source_document_id:
          type: string
          format: uuid
          description: The formal document being broken down.
        result_document_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            The task document this attempt produced. Null until it succeeds,
            and null forever if it does not.
        status:
          type: string
          enum: [pending, running, succeeded, failed]
          description: >-
            `pending` and `running` are in flight; `succeeded` and `failed` are
            over. Nothing moves out of a finished state -- asking again makes a
            new attempt, which is what "try again" means once the first answer
            is recorded.
        error:
          type: string
          nullable: true
          description: >-
            Filled only by `failed`, and relayed as it came. There is nothing
            to classify it into: the reasons a provider refuses are its own.
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    DecompositionResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: "#/components/schemas/Decomposition"
          nullable: true
      additionalProperties: false
    Settings:
      type: object
      required: [title_actor, decomposition_actor, estimation_actor, annotation_actor]
      properties:
        title_actor:
          allOf:
            - $ref: "#/components/schemas/Actor"
          nullable: true
          description: >
            The actor that names conversations from their first user message.
            Null means nobody has been chosen, or the chosen one has since been
            disabled or deleted -- in which case each topic is named by its own
            `assistant_actor_id` instead.
        decomposition_actor:
          allOf:
            - $ref: "#/components/schemas/Actor"
          nullable: true
          description: >
            The actor that breaks a formal document down into a task document.
            Null means nobody has been chosen, or the chosen one has since been
            disabled or deleted -- and unlike naming there is no fallback:
            decomposition belongs to no conversation, so there is no assistant
            to inherit from and the attempt is refused until somebody fills the
            role.
        estimation_actor:
          allOf:
            - $ref: "#/components/schemas/Actor"
          nullable: true
          description: >
            The actor that rates a task's difficulty or produces its three-point
            estimate. Same as decomposition: the job belongs to no conversation,
            so an empty role is a refusal rather than a fallback.
        annotation_actor:
          allOf:
            - $ref: "#/components/schemas/Actor"
          nullable: true
          description: >
            The actor that answers an annotation when somebody asks it to. Same
            as the two above: a person clicked a button on a note rather than
            spoke inside a topic, so there is no assistant to inherit from and
            an empty role is a refusal.
      additionalProperties: false
    SettingsResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Settings"
      additionalProperties: false
    SettingUpdateInput:
      type: object
      required: [actor_id]
      properties:
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: An enabled AI actor, or null to empty the role.
      additionalProperties: false
    ConversationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Conversation"
      additionalProperties: false
    ConversationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
      additionalProperties: false
    ConversationCreateInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          nullable: true
          description: >
            Optional. A title given here is a person's choice of words
            (`title_source: manual`) and is never replaced by the automatic
            one. Omit it, or send null, to have the topic named from its first
            message.
        assistant_actor_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The AI persona to talk to. Required before the topic can be sent a
            message, so set it here unless the user has yet to choose one.
      additionalProperties: false
    ConversationUpdateInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          nullable: true
          description: >
            Sending this at all marks the title as a person's
            (`title_source: manual`), including when it is null: clearing a
            title is a decision, and the topic is not named automatically
            afterwards. A blank string is stored as null.
        assistant_actor_id:
          type: string
          format: uuid
          nullable: true
      additionalProperties: false
    MessageRef:
      type: object
      required: [id, ref_type, position, ref_id, ref_document_id, payload]
      properties:
        id:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
          description: >
            The order the references were given in, which is the order they
            expand into the prelude, and so part of what a replay reproduces.
        ref_type:
          type: string
          description: >
            `document`, `annotation`, `project`, `attachment` or `proposal`.
            Not a closed enum: the set grows, and an unknown type is stored and
            ignored rather than rejecting the turn.


            `conversation` is deliberately absent. Expanding a reference
            renders the thing itself and never follows its pointers, and a
            conversation is the one shape that cannot obey that -- its messages
            carry references of their own. Handing a topic's recent turns back
            to a revived agent is done by the server at send time and is never
            recorded here; see `POST /conversations/{id}/open`.
        ref_id:
          type: string
          format: uuid
          nullable: true
          description: >
            The normalised, indexed identity, which answers "which topics
            discussed this?". Null when it could not be resolved -- a project
            slug whose project is gone, say -- which costs this reference its
            reverse lookup and nothing else.
        ref_document_id:
          type: string
          format: uuid
          nullable: true
          description: Annotations only, which are reachable solely through their document.
        payload:
          type: object
          additionalProperties: true
          description: >
            The reference map exactly as the client sent it, and what a replay
            re-expands. Kept alongside the normalised columns because neither
            can be derived from the other: a project reference is keyed by
            `slug` rather than `id`.
      additionalProperties: false
    Message:
      type: object
      required:
        [
          id,
          conversation_id,
          actor_id,
          role,
          content,
          position,
          refs,
          inserted_at,
          updated_at
        ]
      properties:
        id:
          type: string
          format: uuid
        conversation_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
          description: >
            Kept even though the actor's kind implies it: a replay needs what
            the agent was given, not our attribution of who gave it.
        content:
          type: string
          description: >
            The raw text, never the prelude expanded from the references.
        position:
          type: integer
          minimum: 0
          description: Monotonic order within the conversation.
        refs:
          type: array
          items:
            $ref: "#/components/schemas/MessageRef"
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    MessageResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Message"
      additionalProperties: false
    MessageListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Message"
      additionalProperties: false
    MessageCreateInput:
      type: object
      required: [actor_id, role, content]
      properties:
        actor_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
        refs:
          type: array
          description: >
            What this turn put in front of the model. One of
            `{type: document, id}`, `{type: annotation, id, document_id}`,
            `{type: proposal, id, document_id}`, `{type: project, slug}` or
            `{type: attachment, id}`.
          items:
            type: object
            additionalProperties: true
      additionalProperties: false
    AnnotationReply:
      type: object
      required:
        [
          id,
          annotation_id,
          actor_id,
          content,
          position,
          inserted_at,
          updated_at
        ]
      properties:
        id:
          type: string
          format: uuid
        annotation_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        content:
          type: string
        position:
          type: integer
          minimum: 0
          description: Monotonic order within the annotation. Gaps remain after deletions.
        inserted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    AnnotationReplyCreateInput:
      type: object
      required: [actor_id, content]
      properties:
        actor_id:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
      additionalProperties: false
    AnnotationReplyUpdateInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
      additionalProperties: false
    AnnotationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Annotation"
      additionalProperties: false
    AnnotationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AnnotationSummary"
      additionalProperties: false
    AnnotationReplyResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AnnotationReply"
      additionalProperties: false
    AttachmentCreateInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: >
            The image itself. Its declared content type is ignored; the format
            is sniffed from the bytes.
      additionalProperties: false
    Attachment:
      type: object
      required:
        [
          id,
          actor_id,
          filename,
          mime_type,
          byte_size,
          width,
          height,
          checksum,
          inserted_at,
          last_used_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        filename:
          type: string
          nullable: true
          description: Original upload name, kept for display only.
        mime_type:
          type: string
          enum: [image/png, image/jpeg, image/gif, image/webp]
          description: Detected from the bytes, not from the request.
        byte_size:
          type: integer
          minimum: 1
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        checksum:
          type: string
          description: Lowercase hex SHA-256 of the stored bytes.
        inserted_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
          description: >
            When this image was last expanded into an agent prompt. Null means
            it was uploaded but never sent, which is the state an abandoned
            upload stays in. Recorded for a future retention policy; nothing
            deletes on it today.
      additionalProperties: false
    AttachmentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Attachment"
      additionalProperties: false
    APIErrorCode:
      type: string
      description: Stable machine-readable error code.
      enum:
        - bad_request
        - unauthorized
        - token_not_configured
        - not_found
        - image_too_large
        - unsupported_image
        - stale_document
        - task_already_claimed
        - task_not_yours
        - task_state_conflict
        - dependency_cycle
        - validation_error
        - task_blocked
        - review_round_open
        - invalid_block_op
        - invalid_markdown
        - default_project_missing
        - invalid_estimate
        - invalid_difficulty
        - invalid_actual
        - task_not_splittable
        - document_not_formal
        - decomposition_exists
        - no_decomposition_actor
        - decomposition_in_flight
        - no_estimation_actor
        - nothing_to_estimate
        - no_annotation_actor
        - no_chunks
        - task_before_chunk
        - corrupt_image
        - invalid_branch
        - unknown_branch
        - unusable_repo_name
        - internal_server_error
        - workspace_unwritable
        - workspace_not_configured
        - repo_unavailable
        - attachment_unwritable
        - attachment_unreadable
    APIError:
      type: object
      required: [error, message, details]
      properties:
        error:
          $ref: "#/components/schemas/APIErrorCode"
        message:
          type: string
          description: Human-readable error explanation.
        details:
          type: object
          description: Error-specific structured context.
          additionalProperties: true
      additionalProperties: false
    ValidationError:
      type: object
      required: [error, message, details]
      properties:
        error:
          type: string
          enum: [validation_error]
        message:
          type: string
          example: Request validation failed.
        details:
          type: object
          description: Validation messages grouped by request field.
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: false
    NotFoundError:
      type: object
      required: [error, message, details]
      properties:
        error:
          type: string
          enum: [not_found]
        message:
          type: string
          example: The requested resource was not found.
        details:
          type: object
          additionalProperties: false
      additionalProperties: false
