name: Release CLI

on:
  push:
    tags:
      - "cli-v*"

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - id: version
        shell: bash
        run: |
          version=$(awk -F '"' '/^version = "/ { print $2; exit }' cli/Cargo.toml)
          test -n "$version"
          if [[ "$GITHUB_REF_NAME" != "cli-v$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match cli/Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test CLI
        run: cargo test --locked --manifest-path cli/Cargo.toml

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            executable: rinto-pmo
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            executable: rinto-pmo
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: rinto-pmo
          - os: macos-15
            target: aarch64-apple-darwin
            executable: rinto-pmo
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: rinto-pmo.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: ${{ matrix.target }}
      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --manifest-path cli/Cargo.toml --target "${{ matrix.target }}"
      - name: Name release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "cli/target/${{ matrix.target }}/release/${{ matrix.executable }}" \
            "dist/rinto-pmo-${{ matrix.target }}${{ runner.os == 'Windows' && '.exe' || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: rinto-pmo-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rinto-pmo-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: cd dist && sha256sum rinto-pmo-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: Rinto PMO CLI v${{ needs.verify-version.outputs.version }}
          body: |
            Standalone Rinto PMO CLI binaries.

            Download the asset matching your platform, rename it to `rinto-pmo`
            (`rinto-pmo.exe` on Windows), and put it on `PATH`.

            Existing installations can update with `rinto-pmo update`.
          files: dist/*
          generate_release_notes: true
